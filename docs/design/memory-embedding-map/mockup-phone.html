/* The page remains readable; only the desktop preview scales. */
html { max-width:100%; overflow-x:clip; }
body { width:100%; max-width:100%; overflow-x:clip; background:var(--muted); color:var(--foreground); }
.artifact-page { width:100%; max-width:1320px; min-width:0; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px; }
.review-header { max-width:none; min-width:0; margin:0; padding:0; padding-block:0 16px; }
.review-header > .flex { flex-wrap:wrap; gap:10px; }
.review-header h1 { font-size:23px; line-height:1.25; }
.eyebrow { font-size:11px; }
.review-header > .flex > .badge { font-size:11px; white-space:normal; }
.review-controls { flex-wrap:wrap; gap:10px; margin-top:18px; }
.variant-tabs { flex:1 1 100%; min-width:0; flex-wrap:wrap; width:100%; }
.variant-tabs button { flex:1 1 90px; min-width:0; min-height:44px; padding:7px 5px; font-size:13px; }
.variant-tabs b { font-size:13px; margin-right:4px; }
.theme-button { min-height:44px; font-size:15px; padding-inline:12px; }
.review-note { display:none; }
.preview-tools { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding-block:0 12px; }
.preview-tools .btn { min-height:44px; font-size:15px; padding-inline:12px; border:1px solid var(--border); background:var(--background); }
.preview-tools .btn[aria-pressed="true"] { border-color:var(--ring); }
.preview-hint { flex:1 1 150px; font-size:13px; color:var(--muted-foreground); line-height:1.5; }
.window-wrap { width:100%; max-width:none; min-width:0; margin:0; padding:0; overflow:hidden; }
.window-viewport { width:100%; max-width:100%; overflow:hidden; position:relative; border-radius:12px; overscroll-behavior:contain; }
.window-viewport.is-zoomed { overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.window-frame { position:relative; width:100%; height:0; }
.window { position:absolute; left:0; top:0; width:1280px; min-width:1280px; max-width:1280px; height:800px; margin:0; transform-origin:top left; }
.caption { max-width:none; min-width:0; margin:0; padding:0; padding-block:18px 14px; gap:12px; align-items:flex-start; }
.caption-letter { min-width:28px; height:28px; font-size:14px; }
.caption p { min-width:0; font-size:15px; line-height:1.85; overflow-wrap:anywhere; }
.footer-note { max-width:none; padding:0; padding-block:2px 0; font-size:12px; text-align:left; overflow-wrap:anywhere; }
.preview-tools button:focus-visible, .window-viewport:focus-visible { outline:2px solid var(--ring); outline-offset:-3px; }
@media (min-width:700px) {
 .variant-tabs { flex:0 1 auto; width:auto; }
 .variant-tabs button { flex:initial; padding-inline:13px; font-size:14px; }
 .review-note { display:block; font-size:12px; }
 .artifact-page { padding-block:26px; }
}

 const layer=document.createElement('canvas');layer.width=canvas.width;layer.height=canvas.height;const l=layer.getContext('2d');l.setTransform(dpr,0,0,dpr,0,0);for(let si=0;si<sources.length;si++){for(const active of [false,true]){l.fillStyle=colours[si];l.globalAlpha=active?(dark?.94:.82):.055;l.beginPath();for(const m of memories){if(m.source!==sources[si]||!!activeMask[m.index]!==active)continue;const p=pointPositions[m.index];if(p.x<-4||p.x>w+4||p.y<-4||p.y>h+4)continue;const r=(1+(m.index%5)*.13)*Math.min(1.5,Math.sqrt(state.zoom));l.moveTo(p.x+r,p.y);l.arc(p.x,p.y,r,0,Math.PI*2)}l.fill()}}ctx.globalAlpha=dark?.85:.06;ctx.filter=dark?'blur(13px)':'blur(4px)';ctx.drawImage(layer,0,0,layer.width,layer.height,0,0,w,h);ctx.globalAlpha=dark?1:.12;ctx.filter=dark?'blur(4px)':'blur(2px)';ctx.drawImage(layer,0,0,layer.width,layer.height,0,0,w,h);ctx.filter='none';ctx.globalAlpha=1;ctx.drawImage(layer,0,0,layer.width,layer.height,0,0,w,h);
 const highlighted=new Set([...state.answerIds,...(hovered>=0?[hovered]:[]),...(state.detailOpen?[state.selected]:[])]);ctx.strokeStyle=colour('foreground');ctx.lineWidth=.85;ctx.globalAlpha=dark?.42:.38;ctx.beginPath();for(const index of highlighted){if(!activeMask[index])continue;for(const li of adjacency[index]){const e=links[li];if(!activeMask[e.a]||!activeMask[e.b])continue;const a=pointPositions[e.a],b=pointPositions[e.b];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}}ctx.stroke();ctx.globalAlpha=1;for(const index of highlighted){if(!activeMask[index])continue;const p=pointPositions[index];ctx.beginPath();ctx.arc(p.x,p.y,state.answerIds.includes(index)?5:4,0,Math.PI*2);ctx.fillStyle=colour('foreground');ctx.fill();ctx.strokeStyle=colour('background');ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.strokeStyle=colour('foreground');ctx.globalAlpha=.55;ctx.lineWidth=.8;ctx.stroke();ctx.globalAlpha=1}
 const labelProject=hovered>=0?memories[hovered].projectId:state.detailOpen?selected().projectId:null;for(const p of projects){if(state.zoom<1.3&&p.id!==labelProject)continue;if(!activeMemories.some(m=>m.projectId===p.id))continue;const spot=projectPoint({x:p.x,y:p.y-p.ry*.75},w,h);ctx.font='10px system-ui, sans-serif';const tw=ctx.measureText(p.name).width;const x=Math.max(7,Math.min(spot.x-tw/2-5,w-tw-17)),y=Math.max(105,Math.min(spot.y,h-43));ctx.fillStyle=colour('popover');ctx.strokeStyle=colour('border');ctx.lineWidth=.7;ctx.beginPath();ctx.roundRect(x,y,tw+10,19,4);ctx.fill();ctx.stroke();ctx.fillStyle=colour('foreground');ctx.fillText(p.name,x+5,y+13)}
 if(!activeMemories.length){ctx.fillStyle=colour('muted-foreground');ctx.font='12px system-ui, sans-serif';ctx.textAlign='center';ctx.fillText('No memories match these filters',w/2,h*.53);ctx.textAlign='start'}document.getElementById('zoom-label').textContent=Math.round(state.zoom*100)+'%'}
function bindCanvas(){const canvas=document.getElementById('memory-map');if(!canvas)return;const local=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.clientWidth/r.width,y:(e.clientY-r.top)*canvas.clientHeight/r.height}};canvas.onpointerdown=e=>{pointerDrag={x:e.clientX,y:e.clientY,angle:state.angle,tilt:state.tilt};dragMoved=false;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{const p=local(e);if(pointerDrag){const r=canvas.getBoundingClientRect(),scale=canvas.clientWidth/r.width,dx=(e.clientX-pointerDrag.x)*scale,dy=(e.clientY-pointerDrag.y)*scale;dragMoved=Math.hypot(dx,dy)>4;if(dragMoved){state.angle=pointerDrag.angle+dx*.005;state.tilt=Math.max(.55,Math.min(1,pointerDrag.tilt+dy*.002));document.getElementById('map-tooltip').classList.remove('show');requestPaint()}return}let nearest=-1,distance=9;for(const m of activeMemories){const q=pointPositions[m.index];if(!q)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<distance){distance=d;nearest=m.index}}if(hovered!==nearest){hovered=nearest;requestPaint()}const tip=document.getElementById('map-tooltip');if(nearest<0){tip.classList.remove('show');return}const m=memories[nearest];tip.innerHTML=`<span class="mini-source">${sourceMark(m.source)}${labels[m.source]} · ${m.projectName}</span><h3>${m.title}</h3><p>${m.content}</p>`;tip.style.left=Math.max(7,Math.min(p.x+12,canvas.clientWidth-220))+'px';tip.style.top=Math.max(105,Math.min(p.y+12,canvas.clientHeight-115))+'px';tip.classList.add('show')};canvas.onpointerup=e=>{if(pointerDrag&&!dragMoved){const p=local(e);let nearest=-1,distance=11;for(const m of activeMemories){const q=pointPositions[m.index];if(!q)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<distance){distance=d;nearest=m.index}}if(nearest>=0)chooseMemory(nearest)}pointerDrag=null};canvas.onpointercancel=()=>pointerDrag=null;canvas.onpointerleave=()=>{hovered=-1;document.getElementById('map-tooltip')?.classList.remove('show');requestPaint()};canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.65,Math.min(4,state.zoom+(e.deltaY<0?.15:-.15)));requestPaint()},{passive:false});document.getElementById('zoom-in').onclick=()=>{state.zoom=Math.min(4,state.zoom+.25);requestPaint()};document.getElementById('zoom-out').onclick=()=>{state.zoom=Math.max(.65,state.zoom-.25);requestPaint()};document.getElementById('fit-map').onclick=()=>{state.zoom=1;state.angle=0;state.tilt=1;requestPaint()};canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','+','-','0'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')state.angle-=.12;else if(e.key==='ArrowRight')state.angle+=.12;else if(e.key==='+')state.zoom=Math.min(4,state.zoom+.25);else if(e.key==='-')state.zoom=Math.max(.65,state.zoom-.25);else{state.zoom=1;state.angle=0;state.tilt=1}requestPaint()}}}
function renderBackend(){const area=document.getElementById('backend-overlay');if(!area)return;if(state.status==='sample'){area.innerHTML='';return}const content=state.status==='unconfigured'?`<div class="blank-icon">${icon('map')}</div><h3>Map not set up</h3><p>Local embeddings are the default.</p><div class="r2-local-card"><strong>Local model · default</strong><p class="mono">intfloat/multilingual-e5-small</p><p>About 471 MB of weights. Memory text stays on this device during embedding.</p></div><button class="btn primary" id="setup-settings">Set up in Settings</button><p class="r2-offer">Provider API is optional and off by default. Opt in in Settings only after agreeing that <strong>memory text leaves the device</strong>.</p><p class="tiny" style="margin-top:10px">Preview only · no download or request</p>`:state.status==='indexing'?`<div class="blank-icon">${icon('refresh')}</div><h3>Preparing your memory map</h3><p>${state.embeddingSource==='local'?'Local embedding preview':'Provider API chosen with explicit consent (preview)'}</p><div class="progress"><span></span></div><p>2,280 of 6,000 memories · building the neighbour graph next</p><button class="btn outline" id="cancel-job">Cancel preview</button><p class="tiny" style="margin-top:9px">Simulated progress · no job runs</p>`:`<div class="blank-icon">${icon('info')}</div><h3>The map could not be prepared</h3><p>Memory cards remain available. Retry the preview or review Settings.</p><button class="btn outline" id="retry-job">Retry preview</button>`;area.innerHTML=`<div class="blank-state"><div class="blank-content">${content}</div></div>`;document.getElementById('setup-settings')?.addEventListener('click',openSettings);document.getElementById('cancel-job')?.addEventListener('click',()=>{state.status='unconfigured';document.getElementById('status-select').value=state.status;renderBackend()});document.getElementById('retry-job')?.addEventListener('click',()=>{state.status='indexing';document.getElementById('status-select').value=state.status;renderBackend()})}
function openSettings(){state.screen='settings';state.pendingSource=state.embeddingSource;renderPane('#settings-back')}
function renderSettings(body){body.innerHTML=`<div class="r2-settings"><aside class="r2-settings-nav" aria-label="Settings categories"><p>Workspace</p><div class="r2-settings-item">${icon('settings')}General</div><div class="r2-settings-item">${icon('spark')}Models</div><div class="r2-settings-item active">${icon('brain')}Memory</div><div class="r2-settings-item">${icon('sun')}Appearance</div></aside><section class="r2-settings-main"><div class="r2-return"><button class="btn outline" id="settings-back">${icon('left')}Back to Memory</button></div><h2>Memory embeddings</h2><p>Choose where memory text is processed. Local is the default.</p><div class="r2-setting-card"><label class="flex"><input type="radio" name="embedding-source" value="local" ${state.pendingSource==='local'?'checked=""':''} /><strong class="grow">Local model</strong><span class="badge">Default</span></label><p class="mono">intfloat/multilingual-e5-small</p><p>MIT licence · about 471 MB of FP32 model weights, plus tokenizer and runtime.</p><p>Memory text stays on this device during embedding. An explicit model download would contact the model host.</p></div><div class="r2-setting-card"><label class="flex"><input type="radio" name="embedding-source" value="provider" ${state.pendingSource==='provider'?'checked=""':''} /><strong class="grow">Provider embedding API</strong><span class="badge">Optional · opt-in</span></label><p>Uses a separately configured embedding provider. Disabled by default.</p><p class="r2-provider-warning"><strong>Memory text leaves the device.</strong> Selected note titles and content are sent to the provider. Its retention and regional-processing rules apply.</p><label class="r2-consent"><input type="checkbox" id="provider-consent" ${state.providerConsent?'checked=""':''} /><span>I understand that memory text leaves this device and is sent to my configured provider.</span></label></div><div class="r2-setting-footer"><span class="tiny muted">Preview only. No settings are saved, no model is downloaded, and no text is sent.</span><button class="btn primary" id="apply-embedding">${state.pendingSource==='local'?'Use local model (preview)':'Use provider API (preview)'}</button></div></section></div>`;document.getElementById('settings-back').onclick=()=>{state.screen='memory';renderPane('#embedding-settings')};document.querySelectorAll('input[name="embedding-source"]').forEach(r=>r.onchange=()=>{state.pendingSource=r.value;syncEmbeddingChoice()});document.getElementById('provider-consent').onchange=e=>{state.providerConsent=e.target.checked;syncEmbeddingChoice()};document.getElementById('apply-embedding').onclick=()=>{if(state.pendingSource==='provider'&&!state.providerConsent)return;state.embeddingSource=state.pendingSource;state.screen='memory';state.status='indexing';state.detailOpen=false;renderPane('#status-select');announce('Embedding source preview: '+state.embeddingSource+'. No data was sent.')};syncEmbeddingChoice()}
function syncEmbeddingChoice(){const button=document.getElementById('apply-embedding');button.disabled=state.pendingSource==='provider'&&!state.providerConsent;button.textContent=state.pendingSource==='local'?'Use local model (preview)':'Use provider API (preview)'}
function themeButton(){const dark=state.theme==='dark';document.getElementById('theme-toggle').innerHTML=icon(dark?'sun':'moon')+(dark?'Light':'Dark');document.getElementById('theme-toggle').setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' mode');document.getElementById('theme-toggle').setAttribute('aria-pressed',String(dark))}
function setVariant(v){state.variant=v;state.screen='memory';state.detailOpen=state.status==='sample';state.detailTab='Overview';state.originOpen=false;document.querySelectorAll('[data-variant]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.variant===v));b.tabIndex=b.dataset.variant===v?0:-1});document.getElementById('ave-window').setAttribute('aria-labelledby','variant-'+v);document.getElementById('caption-letter').textContent=v;document.getElementById('caption').innerHTML=captions[v];renderPane()}
document.querySelectorAll('[data-variant]').forEach(b=>{b.onclick=()=>setVariant(b.dataset.variant);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const v=e.key==='Home'?'A':e.key==='End'?'B':state.variant==='A'?'B':'A';setVariant(v);document.getElementById('variant-'+v).focus()}}});document.getElementById('theme-toggle').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;themeButton();requestPaint()};matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!document.documentElement.hasAttribute('data-theme')){state.theme=e.matches?'dark':'light';themeButton();requestPaint()}});shell();themeButton();document.getElementById('caption').innerHTML=captions.A;
let previewZoomed=false;const previewViewport=document.getElementById('preview-viewport'),previewFrame=document.getElementById('preview-frame'),previewZoomButton=document.getElementById('preview-zoom');function fitPreview(){const scale=previewZoomed?1:Math.min(1,previewViewport.clientWidth/1280);document.getElementById('ave-window').style.transform='scale('+scale+')';previewFrame.style.width=1280*scale+'px';previewFrame.style.height=800*scale+'px';previewViewport.style.height=(previewZoomed?Math.min(800,Math.max(300,innerHeight*.7)):800*scale)+'px';previewViewport.classList.toggle('is-zoomed',previewZoomed);previewZoomButton.setAttribute('aria-pressed',String(previewZoomed));previewZoomButton.textContent=previewZoomed?'Fit to screen':'Tap to zoom · 100%';document.getElementById('preview-hint').textContent=previewZoomed?'100% view. Swipe the title bar or sidebar to scroll; drag the map to rotate.':'Fit to screen · '+Math.round(scale*100)+'%. Zoom in to inspect details.';requestPaint()}previewZoomButton.onclick=()=>{previewZoomed=!previewZoomed;previewViewport.scrollTo(0,0);fitPreview()};addEventListener('resize',fitPreview);if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitPreview).observe(previewViewport);fitPreview();

</script>
