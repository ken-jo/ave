[package]
name = "ave-linux-shell-seccomp"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "apply-seccomp"
path = "src/main.rs"

[features]
# Test-only: a bridge left dumpable, the control for the native bridge boundary case. Never built for packaging.
dumpable-bridge-control = []

[dependencies]
libc = "=0.2.177"
seccompiler = "=0.5.0"

[profile.release]
strip = "symbols"
panic = "abort"
