name: Cache pinned runtime tools
description: Reuse fetched tools outside the dependency tree, with the fetchers retaining integrity checks.
inputs:
  repository:
    description: Checkout path relative to the workspace.
    default: .
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/uv-archives
          ${{ inputs.repository }}/resources/mxc
        key: runtime-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/scripts/uv-targets.mjs', inputs.repository), format('{0}/scripts/fetch-uv.mjs', inputs.repository), format('{0}/src/permissions/mxc-launcher-pins.json', inputs.repository), format('{0}/scripts/fetch-mxc.mjs', inputs.repository)) }}
