name: Set up the pinned bun in the runner temp
description: >-
  Installs the bun release named by a .bun-version file under
  RUNNER_TEMP/bun-home/.bun/bin, puts it on the job PATH, and proves the bun
  on PATH is that build. On a self-hosted runner the user's home is the
  owner's own, so bun never lands in, or replaces, the owner's ~/.bun.

inputs:
  bun-version-file:
    description: Path, relative to the workspace, of the file holding the exact bun version.
    required: true

runs:
  using: composite
  steps:
    # setup-bun has no install-directory input: it installs into
    # os.homedir()/.bun/bin. os.homedir() reads HOME (POSIX) and USERPROFILE
    # (Windows), so this step alone sees a home under RUNNER_TEMP, which the
    # runner empties at the start and end of every job.
    - if: runner.os != 'Windows'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.bun-version-file }}
      env:
        HOME: ${{ runner.temp }}/bun-home
        USERPROFILE: ${{ runner.temp }}/bun-home

    # setup-bun v2.2.0 always links bunx.exe to bun.exe with symlinkSync before
    # it looks at any cache, and a Windows file symlink needs the
    # SeCreateSymbolicLinkPrivilege a runner service account does not hold
    # (EPERM). On Windows the release is downloaded here instead, checked
    # against the release's SHASUMS256.txt, and bunx.exe is a copy: bun picks
    # its bunx behaviour from the executable name.
    - if: runner.os == 'Windows'
      name: Install the pinned bun release (Windows)
      shell: bash
      env:
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        version="$(tr -d '[:space:]' < "$BUN_VERSION_FILE")"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "$BUN_VERSION_FILE must hold an exact bun version, found '$version'" >&2
          exit 1
        fi
        case "$RUNNER_ARCH" in
          X64) asset="bun-windows-x64" ;;
          ARM64) asset="bun-windows-aarch64" ;;
          *) echo "no bun Windows release for runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        base="https://github.com/oven-sh/bun/releases/download/bun-v${version}"
        work="$RUNNER_TEMP/bun-download"
        bin="$RUNNER_TEMP/bun-home/.bun/bin"
        rm -rf "$work"
        mkdir -p "$work" "$bin"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
          --output "$work/$asset.zip" "$base/$asset.zip"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
          --output "$work/SHASUMS256.txt" "$base/SHASUMS256.txt"
        expected="$(awk -v name="$asset.zip" '$2 == name { print $1 }' "$work/SHASUMS256.txt")"
        if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
          echo "SHASUMS256.txt of bun v$version has no single SHA-256 for $asset.zip" >&2
          exit 1
        fi
        actual="$(sha256sum "$work/$asset.zip" | awk '{ print $1 }')"
        if [ "$actual" != "$expected" ]; then
          echo "$asset.zip SHA-256 $actual does not match the release's $expected" >&2
          exit 1
        fi
        echo "$asset.zip v$version SHA-256 $actual matches SHASUMS256.txt"
        # Git for Windows ships no unzip; Windows PowerShell 5.1 is on every
        # Windows runner.
        powershell.exe -NoProfile -NonInteractive -Command \
          "\$ErrorActionPreference = 'Stop'; Expand-Archive -LiteralPath '$(cygpath -w "$work/$asset.zip")' -DestinationPath '$(cygpath -w "$work/out")'"
        cp "$work/out/$asset/bun.exe" "$bin/bun.exe"
        cp "$work/out/$asset/bun.exe" "$bin/bunx.exe"
        rm -rf "$work"
        cygpath -w "$bin" >> "$GITHUB_PATH"

    - name: Verify bun is the job-local pinned build
      shell: bash
      env:
        BUN_HOME: ${{ runner.temp }}/bun-home
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
      run: |
        set -euo pipefail
        expected="$(tr -d '[:space:]' < "$BUN_VERSION_FILE")"
        # Git Bash on Windows reports PATH entries in /c/... form.
        home="$(cygpath -u "$BUN_HOME" 2>/dev/null || printf '%s' "$BUN_HOME")"
        for tool in bun bunx; do
          actual="$("$tool" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "$tool $actual on PATH, expected $expected from $BUN_VERSION_FILE" >&2
            exit 1
          fi
          tool_path="$(command -v "$tool")"
          case "$tool_path" in
            "$home"/*) ;;
            *)
              echo "$tool on PATH is $tool_path, not the job-local install under $home" >&2
              exit 1
              ;;
          esac
        done
