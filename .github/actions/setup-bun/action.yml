name: Set up the pinned bun in the runner temp
description: >-
  Installs the bun release named by a .bun-version file under
  RUNNER_TEMP/bun-home/.bun/bin from its pinned, checksum-verified release
  archive, puts it on the job PATH, and proves the bun on PATH is that build.
  On a self-hosted runner the user's home is the owner's own, so bun never
  lands in, or replaces, the owner's ~/.bun.

inputs:
  bun-version-file:
    description: Path, relative to the workspace, of the file holding the exact bun version.
    required: true

runs:
  using: composite
  steps:
    # The upstream setup-bun action checks no digest on a download or on a
    # cache hit (a hit compares only `bun --revision`), so every OS takes the
    # release archive itself. Only the source zip is cached, and every
    # restore passes the pin and SHASUMS256.txt checks before extraction.
    # Executables land under RUNNER_TEMP/bun-home, which the runner empties
    # at the start and end of every job, never in the user's ~/.bun.
    - name: Resolve the pinned archive
      id: bun-archive
      shell: bash
      env:
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/bun-archive.sh" metadata

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: bun-archive-cache
      with:
        path: ${{ runner.temp }}/bun-download
        key: ${{ steps.bun-archive.outputs.key }}

    - if: runner.os != 'Windows'
      name: Install the pinned bun release
      shell: bash
      env:
        VERSION: ${{ steps.bun-archive.outputs.version }}
        ASSET: ${{ steps.bun-archive.outputs.asset }}
        PINNED: ${{ steps.bun-archive.outputs.pinned }}
        CACHE_HIT: ${{ steps.bun-archive-cache.outputs.cache-hit }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/bun-archive.sh" verify
        work="$RUNNER_TEMP/bun-download"
        bin="$RUNNER_TEMP/bun-home/.bun/bin"
        mkdir -p "$bin"
        rm -rf "$work/out"
        unzip -q "$work/$ASSET.zip" -d "$work/out"
        cp "$work/out/$ASSET/bun" "$bin/bun"
        cp "$work/out/$ASSET/bun" "$bin/bunx"
        chmod 755 "$bin/bun" "$bin/bunx"
        rm -rf "$work/out"
        echo "$bin" >> "$GITHUB_PATH"

    - if: runner.os == 'Windows'
      name: Install the pinned bun release (Windows)
      shell: bash
      env:
        VERSION: ${{ steps.bun-archive.outputs.version }}
        ASSET: ${{ steps.bun-archive.outputs.asset }}
        PINNED: ${{ steps.bun-archive.outputs.pinned }}
        CACHE_HIT: ${{ steps.bun-archive-cache.outputs.cache-hit }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/bun-archive.sh" verify
        work="$RUNNER_TEMP/bun-download"
        bin="$RUNNER_TEMP/bun-home/.bun/bin"
        mkdir -p "$bin"
        rm -rf "$work/out"
        ARCHIVE_PATH="$(cygpath -w "$work/$ASSET.zip")" EXTRACT_PATH="$(cygpath -w "$work/out")" \
          powershell.exe -NoProfile -NonInteractive -Command \
          '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:EXTRACT_PATH'
        cp "$work/out/$ASSET/bun.exe" "$bin/bun.exe"
        cp "$work/out/$ASSET/bun.exe" "$bin/bunx.exe"
        rm -rf "$work/out"
        cygpath -w "$bin" >> "$GITHUB_PATH"

    # bun install runs node-gyp for native modules (better-sqlite3), and
    # node-gyp needs Python, which a self-hosted Windows runner may lack.
    # actions/setup-python is not used here: on Windows it runs the CPython
    # installer with InstallAllUsers=1 and deletes matching uninstall registry
    # entries under HKLM/HKCU, a machine-wide change, and needs administrator
    # rights. The Python Software Foundation's relocatable NuGet package is
    # unpacked under RUNNER_TEMP instead, after its SHA-256 matches the pin
    # below (the same bytes NuGet's catalog lists by SHA-512), and only
    # node-gyp is pointed at it through PYTHON; PATH is left alone.
    - if: runner.os == 'Windows'
      name: Provide Python for node-gyp (Windows)
      shell: bash
      env:
        PYTHON_VERSION: 3.12.10
        PYTHON_NUPKG_SHA256: 0eb85c2dfccccf1b17352de4c397f69194035b7d37149eacc16f1147d93de3b8
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/python-download"
        dest="$RUNNER_TEMP/python-$PYTHON_VERSION"
        rm -rf "$work" "$dest"
        mkdir -p "$work"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 6 --retry-delay 5 --retry-max-time 180 \
          --output "$work/python.zip" \
          "https://api.nuget.org/v3-flatcontainer/python/$PYTHON_VERSION/python.$PYTHON_VERSION.nupkg"
        # Hash stdin: sha256sum escapes its output for a path with a backslash.
        actual="$(sha256sum < "$work/python.zip" | awk '{ print $1 }')"
        if [ "$actual" != "$PYTHON_NUPKG_SHA256" ]; then
          echo "python.$PYTHON_VERSION.nupkg SHA-256 '$actual' does not match the pinned $PYTHON_NUPKG_SHA256" >&2
          exit 1
        fi
        echo "python.$PYTHON_VERSION.nupkg SHA-256 $actual matches the pin"
        powershell.exe -NoProfile -NonInteractive -Command \
          "\$ErrorActionPreference = 'Stop'; Expand-Archive -LiteralPath '$(cygpath -w "$work/python.zip")' -DestinationPath '$(cygpath -w "$work/out")'"
        mv "$work/out/tools" "$dest"
        rm -rf "$work"
        reported="$("$dest/python.exe" --version)"
        if [ "$reported" != "Python $PYTHON_VERSION" ]; then
          echo "unpacked python reports '$reported', expected Python $PYTHON_VERSION" >&2
          exit 1
        fi
        echo "PYTHON=$(cygpath -w "$dest/python.exe")" >> "$GITHUB_ENV"
        echo "node-gyp will use $reported from $dest"

    - name: Verify bun is the job-local pinned build
      shell: bash
      env:
        BUN_HOME: ${{ runner.temp }}/bun-home
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
      run: |
        set -euo pipefail
        expected="$(tr -d '[:space:]' < "$BUN_VERSION_FILE")"
        # Git Bash on Windows reports PATH entries in /c/... form.
        home="$(cygpath -u "$BUN_HOME" 2>/dev/null || printf '%s' "$BUN_HOME")"
        for tool in bun bunx; do
          actual="$("$tool" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "$tool $actual on PATH, expected $expected from $BUN_VERSION_FILE" >&2
            exit 1
          fi
          tool_path="$(command -v "$tool")"
          case "$tool_path" in
            "$home"/*) ;;
            *)
              echo "$tool on PATH is $tool_path, not the job-local install under $home" >&2
              exit 1
              ;;
          esac
        done
