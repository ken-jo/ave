name: Web Deploy

on:
  push:
    branches: [main]
    # The web build also reads these files outside web/ (CHANGELOG.md is the
    # changelog page; the scripts run the build, its document guard and its
    # export check; web/lib/providers.ts imports the two src/shared files), so a
    # change to any of them changes the site.
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - 'scripts/run-web-build.mjs'
      - 'scripts/lib/web-export.mjs'
      - 'scripts/lib/document-consumer-guard.mjs'
      - 'scripts/lib/document-consumer-node-options.mjs'
      - 'scripts/lib/git-process-environment.mjs'
      - 'scripts/hooks/pre-push-markdown-policy.mjs'
      - 'scripts/hooks/documentation-references.json'
      - 'src/shared/llm-vendor-defaults.ts'
      - 'src/shared/model-host-policy.ts'
      - '.github/workflows/web-deploy.yml'
  repository_dispatch:
    types: [deploy-web]

permissions:
  contents: read

jobs:
  # The guard literal must equal package.json `repository` owner/repo; an
  # `if:` cannot read a file, so test/scripts/repository-identity.test.ts
  # fails when the two disagree instead of letting both jobs skip silently.
  build:
    if: github.repository == 'ken-jo/ave'
    # A GitHub-hosted runner, as every workflow job is
    # (workflow-runner-policy.ts). Only default-branch pushes and
    # repository_dispatch reach this workflow, never a fork PR.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      config_sha256: ${{ steps.bundle.outputs.config_sha256 }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    env:
      REQUESTED_HEAD: ${{ github.event.client_payload.head_sha || github.sha }}
      # Bun's package cache defaults to the runner user's home; keep it in the
      # workspace.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REQUESTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      # The home isolation below runs on this pinned Node, not on whatever
      # Node the runner image carries.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - id: verify
        name: Verify exact default-branch source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$REQUESTED_HEAD" ]
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor \
            "$REQUESTED_HEAD" \
            refs/remotes/origin/main
          printf 'source_sha=%s\n' "$REQUESTED_HEAD" >> "$GITHUB_OUTPUT"

      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version

      # The install scripts and the Next build resolve os.homedir() and
      # os.tmpdir(); keep them job-local.
      - name: Isolate home and temp directories in the runner temp
        shell: bash
        run: node .github/scripts/isolate-job-home.mjs

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build static export
        working-directory: web
        run: bun run build

      - id: bundle
        name: Create deterministic deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          if find web/out -type l -print -quit | grep -q .; then
            echo "::error::web export must not contain symbolic links"
            exit 1
          fi
          mkdir -p staged-web
          (
            cd web/out
            find . -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum
          ) > staged-web/files.sha256
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf staged-web/web-out.tar.gz \
            -C web/out .
          # The Worker config travels with the export, so the deploy job
          # needs no checkout and deploys exactly what this commit names.
          cp web/wrangler.jsonc staged-web/wrangler.jsonc
          bundle_sha256="$(sha256sum staged-web/web-out.tar.gz | cut -d ' ' -f 1)"
          config_sha256="$(sha256sum staged-web/wrangler.jsonc | cut -d ' ' -f 1)"
          printf '%s  web-out.tar.gz\n%s  wrangler.jsonc\n' "$bundle_sha256" "$config_sha256" > staged-web/bundle.sha256
          printf '%s\n' "$REQUESTED_HEAD" > staged-web/source.sha
          printf 'bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_OUTPUT"
          printf 'config_sha256=%s\n' "$config_sha256" >> "$GITHUB_OUTPUT"

      - id: upload
        name: Upload digest-bound web export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-web
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.repository == 'ken-jo/ave'
    runs-on: ubuntu-24.04-arm
    environment: web-production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # wrangler-action installs wrangler with npm; keep npm's cache in the
      # workspace instead of the runner user's ~/.npm.
      npm_config_cache: ${{ github.workspace }}/.cache/npm
    steps:
      # Start from an empty workspace, and give wrangler a home under
      # RUNNER_TEMP for its config and logs instead of the runner user's.
      - name: Start from an empty workspace and a job-local home
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staged-web verified-out
          mkdir -p "$RUNNER_TEMP/job-home"
          printf 'HOME=%s\n' "$RUNNER_TEMP/job-home" >> "$GITHUB_ENV"

      # wrangler-action runs wrangler with npm; pin Node 24 and its npm rather
      # than whichever the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download verified web export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-web

      - name: Verify and extract deploy bundle
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
          EXPECTED_CONFIG_SHA256: ${{ needs.build.outputs.config_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CONFIG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(cat staged-web/source.sha)" = "$EXPECTED_SOURCE_SHA" ]
          (cd staged-web && sha256sum -c bundle.sha256)
          [ "$(sha256sum staged-web/web-out.tar.gz | cut -d ' ' -f 1)" = "$EXPECTED_BUNDLE_SHA256" ]
          [ "$(sha256sum staged-web/wrangler.jsonc | cut -d ' ' -f 1)" = "$EXPECTED_CONFIG_SHA256" ]
          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..) echo "::error::unsafe web archive path: $entry"; exit 1 ;;
            esac
          done < <(tar -tzf staged-web/web-out.tar.gz)
          mkdir -p site/out
          tar -xzf staged-web/web-out.tar.gz -C site/out
          (cd site/out && sha256sum -c ../../staged-web/files.sha256)
          cp staged-web/wrangler.jsonc site/wrangler.jsonc

      # Worker `ave-web` serves ave.agent-connector.ai from static assets; the
      # preview Worker `ave-web-dev` (dev.agent-connector.ai) has the same shape.
      - name: Deploy verified static files to the ave-web Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 77a8f0e860cd23f37141248fd4e6935f
          wranglerVersion: "4.114.0"
          packageManager: npm
          workingDirectory: site
          command: deploy --config wrangler.jsonc
