name: Native OS focus
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      keyboard-takeover-only:
        description: Run the native keyboard takeover regression and its focus-loss control only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-os-focus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  os-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ave
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          persist-credentials: false
      - uses: ./ave/.github/actions/setup-bun
        with:
          bun-version-file: ave/.bun-version
      - run: bun install --frozen-lockfile
      - name: Install native pointer and keyboard tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool openbox
      - name: Prove native keyboard takeover and focus-loss detection
        env:
          AVE_E2E_OS_FOCUS: "1"
        run: |
          set -euo pipefail
          task_home=$(mktemp -d "$RUNNER_TEMP/native-keyboard-home.XXXXXX")
          mkdir -p "$task_home/tmp"
          export HOME="$task_home" AVE_HOME="$task_home/.ave" TMPDIR="$task_home/tmp"
          source_file=src/main/browser/browser-native-surfaces.ts
          source_backup="$RUNNER_TEMP/native-keyboard-surfaces.ts"
          cp "$source_file" "$source_backup"
          trap 'cp "$source_backup" "$source_file"' EXIT
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/main/browser/browser-native-surfaces.ts';
          const source = readFileSync(path, 'utf8');
          const dispatch = 'entry.contents.sendInputEvent(event);';
          if (source.split(dispatch).length !== 2) throw new Error('Native pointer dispatch is unavailable or ambiguous');
          writeFileSync(path, source.replace(dispatch,
            `${dispatch}\n        if (input.type === "mouseDown") entry.owner.webContents.focus();`));
          NODE
          bun run build
          mkdir -p test-results/native-keyboard-red
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/native-keyboard-red/results.json \
            xvfb-run -a -s '-screen 0 1600x1000x24' sh -c '
              openbox > test-results/native-keyboard-red/window-manager.log 2>&1 &
              manager_pid=$!
              trap "kill $manager_pid" EXIT
              bun run test:ui-e2e:os-focus ui/browser-ui-keyboard-takeover.spec.ts --grep 1360x800 --retries=0 --reporter=list,json --output=test-results/native-keyboard-red/cases
            '
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo 'Native keyboard test accepted the redirected-focus regression' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const report = JSON.parse(readFileSync('test-results/native-keyboard-red/results.json', 'utf8'));
          const failures = [];
          const visit = suite => {
            for (const spec of suite.specs ?? []) for (const test of spec.tests) {
              for (const result of test.results) for (const error of result.errors ?? []) failures.push(error.message ?? '');
            }
            for (const child of suite.suites ?? []) visit(child);
          };
          for (const suite of report.suites) visit(suite);
          if (report.stats.unexpected !== 1 || report.stats.expected !== 0 || report.stats.skipped !== 0
            || !failures.some(message => message.includes('OS keyboard takeover typing must reach the native page'))) {
            throw new Error('Focus-loss control did not fail at native keyboard delivery');
          }
          const directory = 'test-results/native-keyboard-red/cases';
          const receipts = readdirSync(directory, { recursive: true }).filter(path => path.endsWith('native-keyboard-routing-1360.json'));
          if (receipts.length !== 1) throw new Error('Focus-loss control receipt is unavailable or ambiguous');
          const proof = JSON.parse(readFileSync(join(directory, receipts[0]), 'utf8'));
          const keys = proof.samples.find(sample => sample.phase === 'after-os-page-key-request');
          if (keys?.page.value !== '' || keys.composer.value !== 'HOSTDRAFTAFTERAGENTPAGEKEYS') {
            throw new Error('Focus-loss control did not prove system keys reached the composer');
          }
          console.log('Focus-loss control rejected by native keyboard takeover assertion');
          NODE
          cp "$source_backup" "$source_file"
          git diff --exit-code -- "$source_file"
          bun run build
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/native-keyboard-green/results.json \
            xvfb-run -a -s '-screen 0 1600x1000x24' sh -c '
              mkdir -p test-results/native-keyboard-green
              openbox > test-results/native-keyboard-green/window-manager.log 2>&1 &
              manager_pid=$!
              trap "kill $manager_pid" EXIT
              bun run test:ui-e2e:os-focus ui/browser-ui-keyboard-takeover.spec.ts --retries=0 --reporter=list,json --output=test-results/native-keyboard-green/cases
            '
      - if: github.event_name != 'workflow_dispatch' || !inputs.keyboard-takeover-only
        run: xvfb-run -a bun run test:ui-e2e:os-focus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-os-focus-results
          path: ave/test-results
          retention-days: 7
