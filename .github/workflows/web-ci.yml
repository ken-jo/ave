name: Web CI

# CI for the monorepo landing site under web/ (Next.js static export → Cloudflare
# Pages). Runs only when web/ or a file its build reads changes, so it stays
# independent of the app CI.
# This workflow is a secret-free build gate for PRs and pushes. Deployment is
# owned by web-deploy.yml and its protected production environment.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - 'scripts/run-web-build.mjs'
      - 'scripts/lib/web-export.mjs'
      - 'scripts/lib/document-consumer-guard.mjs'
      - 'scripts/lib/document-consumer-node-options.mjs'
      - 'scripts/lib/git-process-environment.mjs'
      - 'scripts/hooks/pre-push-markdown-policy.mjs'
      - 'scripts/hooks/documentation-references.json'
      - 'src/shared/llm-vendor-defaults.ts'
      - 'src/shared/model-host-policy.ts'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - 'scripts/run-web-build.mjs'
      - 'scripts/lib/web-export.mjs'
      - 'scripts/lib/document-consumer-guard.mjs'
      - 'scripts/lib/document-consumer-node-options.mjs'
      - 'scripts/lib/git-process-environment.mjs'
      - 'scripts/hooks/pre-push-markdown-policy.mjs'
      - 'scripts/hooks/documentation-references.json'
      - 'src/shared/llm-vendor-defaults.ts'
      - 'src/shared/model-host-policy.ts'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Build (static export)
    # GitHub-hosted runner, as every job is; see workflow-runner-policy.ts.
    # The same pinned ARM64 image web-deploy.yml builds and deploys on, so
    # this gate builds the export the way the deploy does.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version
      - name: Install (retry on transient registry flakes)
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "::warning::bun install attempt $attempt failed; clearing cache + retrying"
            rm -rf ~/.bun/install/cache || true
            sleep 10
          done
          echo "::error::bun install failed after 3 attempts"; exit 1
      # `next build` runs type-checking + the static export (Next 16 no longer
      # lints during build; web/ has no lint config), so it is the whole gate —
      # a broken page, type error, or bad import fails here.
      - name: Build
        run: bun run build
      - name: Upload static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-out
          path: web/out
          if-no-files-found: error
          retention-days: 3
