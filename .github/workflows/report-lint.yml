name: Report lint

# Report-only Biome lint (formatter off, `biome.json`). It never blocks a
# merge: the step continues on error and nothing requires this check, the
# pre-push hook does not run it and gate-core does not include it. The counts
# show whether the recommended rule set is worth adopting rule by rule.

on:
  pull_request:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  biome:
    # GitHub-hosted runner, as every job is; see workflow-runner-policy.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Biome lint (report only)
        continue-on-error: true
        run: bun run report:biome
