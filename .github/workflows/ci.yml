name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    # By default runs use ephemeral GitHub-hosted ARM64 runners (the
    # AVE_LINUX_RUNNER note below is the opt-in self-hosted path). Ephemeral VMs
    # cannot persist state or exfiltrate secrets across runs, which closes
    # the "pwn-request" supply-chain RCE vector that made the prior
    # self-hosted Oracle runner risky for fork PRs (a fork controls
    # package.json + postinstall scripts, and `bun install` would execute
    # attacker code). ARM64 keeps native-module (better-sqlite3 etc.) parity
    # with the dev fleet. Core CI is deliberately secret-free and does not
    # clone private sibling repositories; cross-repository integration belongs
    # to trusted default-branch repository_dispatch workflows.
    # Runner from repo variable AVE_LINUX_RUNNER (JSON label array, e.g.
    # ["self-hosted","Linux","ARM64","ave"]); unset = hosted fallback, and a
    # fork pull request always gets the hosted label. Private repo only: unset
    # AVE_LINUX_RUNNER before the repo goes public.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check documentation diff
        if: steps.docs-impact.outputs.docs_only == 'true'
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA..HEAD"
      - name: Check documentation policy
        if: steps.docs-impact.outputs.docs_only == 'true'
        working-directory: ave
        run: node --import ./scripts/lib/document-consumer-guard.mjs --test test/scripts/check-asrt-version-claims.test.mjs && node scripts/check-asrt-version-claims.mjs
      # The pinned bun from .bun-version goes under RUNNER_TEMP, never into
      # the owner's own bun home on a self-hosted runner; on Windows it is a
      # checksum-verified release download (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      # Cache the built node_modules (Electron dist + electron-rebuilt native
      # modules) keyed on os+arch+lockfile. On a hit, `bun install` restores the
      # ABI-correct binaries without re-downloading Electron or recompiling
      # better-sqlite3/node-pty. Exact-key only — a lockfile change (which pins
      # the Electron version) misses and rebuilds, so a stale ABI never leaks in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      # uv is fetched to resources/ (outside node_modules) by the postinstall,
      # which bun skips when node_modules is already satisfied from cache. Ensure
      # it explicitly — fetch-uv is idempotent (no-op when already present).
      - name: Ensure uv toolchain
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5): the harness verifies it,
      # installs `mcp` 2.2.0 for it with the uv above and proves the import, so
      # no step relies on the runner image's own python3.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      # The steps above are preconditions, not gates: without a checkout, an
      # install, the uv toolchain and the smoke's Python there is nothing to
      # verify, so a red job there genuinely means "could not verify". From
      # here down the job compiles, builds and tests the product — every step
      # below is one of those, except `Remove root-level Bun binary shims`,
      # which prepares the runner for the step after it — and the
      # repository-hygiene gates run after all of it, at the end of this job.
      # The block above them says why they are there and not above.
      - name: Typecheck
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run typecheck
      # `typecheck` covers production sources only — both tsconfigs exclude
      # `src/**/__tests__/**`, so before this step a test could reference an unimported
      # symbol and reach CI green. This is the ratchet for the rest: new test files are
      # fully checked, existing ones may only improve. The self-test runs beside it
      # because a ratchet that silently stops comparing reports green forever.
      - name: Typecheck tests (baseline ratchet)
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:typecheck-tests:self-test && bun run check:typecheck-tests
      # Postinstall leaves native modules on Electron's ABI. The shared Vitest
      # runner uses ELECTRON_RUN_AS_NODE, so tests and the desktop runtime consume
      # that same binary without an in-place Node-ABI rebuild.
      - run: bun run build
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      - name: Remove root-level Bun binary shims before Vitest
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: rm -f ajv pino
      - name: Run the suite and its coverage gate
        if: steps.docs-impact.outputs.docs_only != 'true'
        # The suite resolves entirely from ave/src. Sibling slugs appear
        # only as fixtures or mocked installer inputs.
        #
        # `check:test-coverage`, not `check:test-quality`: that composite runs
        # `check:test-duplicates` first, so a duplicated test helper would end
        # this step before a single test executed — the same masking defect one
        # layer down, in an npm script instead of a workflow. This job calls the
        # composite's two halves separately, the duplicate scan last;
        # `check:test-quality` stays as the local one-shot README.md documents.
        env:
          AVE_SMOKE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bun run check:test-coverage
        working-directory: ave
      # Repository hygiene: manifests, baseline ledgers, and the self-tests of
      # the gates that read them. Nothing below compiles or runs the product; a
      # failure here means a bookkeeping file is stale, not that the code is
      # broken.
      #
      # Two of the four used to run ahead of Typecheck; the duplicate scan ran
      # ahead of the suite from inside `check:test-quality`, and the sunset
      # ledger ahead of every compile from inside `bun run build`. Two changes
      # landed the same day — one declared every tracked image in a manifest,
      # the other deleted some of those images — and the merge left the
      # manifest stale. The gate failed, and because a job stops at its first
      # failed step, Typecheck, the test-typecheck ratchet, the build and the
      # entire suite were skipped. `main` carried a red check that meant
      # "nothing was verified", which is indistinguishable from "something was
      # verified and failed" and so is worse than having no gate at all.
      # Running these four after every verification step ends that for them.
      # It does not end it for the repository: the paragraph below names the
      # commands where the same shape survives, inside `bun run build`.
      #
      # Last *in this job* rather than in a job of their own, because the check
      # name `build-and-test` is one of the two required status checks on
      # `main`; the other is `naming-gate`. Read the current list with
      #   gh api repos/ken-jo/ave/branches/main/protection \
      #     --jq .required_status_checks.contexts
      # A separate job reports under a separate check name, and a name branch
      # protection does not list cannot block a merge. That is measured, not
      # feared: an earlier revision of this change put these three in a
      # `repo-hygiene` job, and on a commit carrying a deliberately stale
      # manifest entry both required contexts reported success. Two checks did
      # go red on it — `Repository hygiene gates` here and a web-ci.yml job —
      # and neither name is in the required list,
      # so neither stood between that manifest and a merge. Two jobs is the
      # better shape and stays available — but the required-contexts list has to
      # gain the new name in the same change, or the split trades a masking bug
      # for a silent hole.
      #
      # Within this trailing group the first failure still skips the rest: a red
      # Knip gate leaves the duplicate and sunset scans reported as
      # skipped. That is accepted, not overlooked. Every verification step has
      # already run and reported its own result by then, and the failing step
      # names itself, so the red says one true thing — a ledger is stale, and
      # this is the first one. Reporting all four independently would need `if:
      # always()` on each, which also runs them after a genuine build failure
      # and chains bookkeeping noise onto a red that already has its answer, or
      # one runner per gate.
      #
      # What this ordering does NOT reach: `bun run build` above is one workflow
      # step and twenty commands, and fourteen of those assert rather than
      # compile. Seven of the fourteen — `check:import-cycles`,
      # `check-generated-assets`, `check:plugin-host-protocol-schema`,
      # `check:plugin-host-protocol-mirror`, `check:plugin-host-protocol-client`,
      # `check:i18n-catalog`, `check:i18n-barrels` — sit ahead of a later
      # compile command inside the composite, and all fourteen sit ahead of the
      # suite in this job, so any of them can fail the build step and skip the
      # steps after it. That residual is deliberate and bounded: each reads
      # either the sources being compiled or the bytes the build itself just
      # wrote, and a local `bun run build` is where their drift has to surface.
      # `check:sunset-inventory` was the one that did not fit that description —
      # it reads a hand-written ledger naming source paths that any unrelated
      # change can delete, the same shape as the manifest incident above — so it
      # left the composite and runs here instead. Measured on this tree before
      # the move: one nonexistent path added to the inventory made `bun run
      # build` exit 1 at `[sunset-inventory]`, with clean-dist, build:icons,
      # build:main and build:webpack never reached.
      #
      # `src/__tests__/packaging-discipline-source.test.ts` fails if any job in
      # .github/workflows/ puts one of these gates ahead of a compile or test
      # step, if these gates leave `build-and-test`, if one of them re-enters
      # the `build` composite, and if the set of asserting commands inside that
      # composite changes without the list above changing with it.
      # `check:gate-core` is the one inventory of the gates both CI and the
      # pre-push hook (scripts/hooks/run-local-checks.mjs) run: the Knip
      # baseline, the duplicate-helper scan, the sunset ledger, the
      # single-source shape ledger, and the ASRT capability claims. The two callers
      # used to list them separately and had drifted. The gates below it are
      # CI-only on purpose — the Knip self-test costs more than a pre-push
      # budget allows — and
      # `check:test-coverage` above is CI-only for the same reason.
      - name: Core hygiene gates
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:gate-core && bun run test:knip-gate

  windows-permission-tests:
    name: Windows permission path tests
    # Runner from repo variable AVE_WINDOWS_RUNNER (JSON label array, e.g.
    # ["self-hosted","Windows","X64","ave-release"], or a hosted label such as
    # "\"windows-latest\"" — a quoted JSON string — to opt into a GitHub-hosted
    # runner explicitly), the variable build-installers.yml reads. Unset falls
    # back to any self-hosted runner only so the check below can fail naming
    # the variable, never to a billing-blocked hosted label. A pull request
    # from a fork always gets the hosted label: a fork run may not see repo
    # variables at all, and the self-hosted fallback would then hand it the
    # owner's machine. That guard lives in this file, which a fork PR can
    # edit, so the repo setting that holds fork workflows for approval stays
    # the real boundary; keep it on, and before going public also set the
    # variable to its hosted label.
    # The runner needs Git for Windows (bash) and the C++ build tools that
    # scripts/build-windows-job.ps1 finds through vswhere.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'windows-latest' || vars.AVE_WINDOWS_RUNNER && fromJSON(vars.AVE_WINDOWS_RUNNER) || 'self-hosted' }}
    env:
      # A self-hosted runner's home is the owner's own: keep bun's package
      # cache and Electron's download cache in the workspace.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
          persist-credentials: false
      # Self-hosted machines have no preinstalled toolcache; install Node into
      # the runner's own tool cache instead of relying on a system Node. The
      # runner check and the docs classifier below both run on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require the runner variable
        shell: bash
        working-directory: ave
        env:
          AVE_WINDOWS_RUNNER: ${{ vars.AVE_WINDOWS_RUNNER }}
        run: bash .github/scripts/require-runner-vars.sh AVE_WINDOWS_RUNNER
      - name: Classify documentation impact
        id: docs-impact
        shell: bash
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # The pinned bun from .bun-version goes under RUNNER_TEMP, never into
      # the owner's own bun home on a self-hosted runner; on Windows it is a
      # checksum-verified release download (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Every later step (install scripts, the Windows helper checks, the
      # tests and the post-job cache saves) sees a home and a temp directory
      # under RUNNER_TEMP, which the runner empties around every job, instead
      # of the owner's profile and %LOCALAPPDATA%\Temp.
      - name: Isolate home and temp directories in the runner temp
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        run: node ave/.github/scripts/isolate-job-home.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      - name: Verify native background process ownership
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        # Windows PowerShell ships with every Windows install; a self-hosted
        # runner's default shell depends on whether PowerShell 7 is present.
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1 -FailureFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-job.mjs
      # Folder sources classify a drive letter from its MS-DOS device mapping
      # without opening the drive (design multi-source-git-marketplace.md §18.4.1).
      - name: Verify Windows folder classification
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        # Windows PowerShell ships with every Windows install; a self-hosted
        # runner's default shell depends on whether PowerShell 7 is present.
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1 -Helper path-kind
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-path-kind.mjs
      # The tag build runs `bun run build` on Windows, and this check is part of
      # it: there the generator finds its sources through Windows path spellings
      # (drive letters, `\` separators), and must still produce the same bytes.
      - name: Plugin host protocol schema matches its sources
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:plugin-host-protocol-schema
      - name: Run Windows permission regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: >
          bun run test --
          src/permissions/__tests__/allowed-directories.test.ts
          src/permissions/__tests__/sensitive-paths-canonicalize.test.ts
          src/permissions/__tests__/permission-manager-meta-override.test.ts
          src/tools/__tests__/executor.test.ts
          src/tools/__tests__/registry-meta-governance.test.ts
          src/tools/__tests__/executor-rationale-batch.test.ts
          src/tools/pipeline/__tests__/rationale-host-coordinator.test.ts
          src/tools/pipeline/__tests__/rationale-host-service.test.ts
          src/tools/pipeline/__tests__/rationale-invocation-journal.test.ts
          src/tools/pipeline/__tests__/rationale-ticket-store.test.ts
          src/engine/turn/__tests__/rationale-real-stack.integration.test.ts
          src/audit/__tests__/hmac-chain.test.ts
          src/audit/__tests__/rationale-audit-adapter.test.ts
          src/boot/__tests__/plugin-surface-permissions.test.ts
          src/main/__tests__/windows-job-launcher.test.ts
          src/tools/__tests__/background-shell-windows-job.test.ts
          src/tools/__tests__/bash-dialect.test.ts
          src/permissions/__tests__/windows-sandbox-logic.test.ts
          src/permissions/__tests__/asrt-windows-support.test.ts
          src/tools/__tests__/shell-windows-partial-plan-b.test.ts
          src/lib/__tests__/atomic-file.test.ts
          src/shared/__tests__/ave-home.test.ts
          src/lib/__tests__/with-file-lock.test.ts
          src/data/__tests__/secret-document-store.test.ts
          src/plugins/__tests__/registry-atomicity.test.ts
          src/plugins/__tests__/registry-migration.test.ts
          src/plugins/__tests__/installed-entry-fs.test.ts
          src/plugins/__tests__/plugin-artifact-store-windows-lock.test.ts
          src/plugins/__tests__/marketplace-update-recovery.test.ts
          src/plugins/__tests__/install-local.test.ts
          src/plugins/__tests__/trust-boundary.test.ts

  macos-permission-tests:
    name: macOS permission path tests
    # Runner from repo variable AVE_MACOS_RUNNER (JSON label array, e.g.
    # ["self-hosted","macOS","ARM64","ave-release"], or a hosted label such as
    # "\"macos-15\"" — a quoted JSON string — to opt into a GitHub-hosted runner
    # explicitly), the variable build-installers.yml reads. Unset falls back
    # to any self-hosted runner only so the check below can fail naming the
    # variable, never to a billing-blocked hosted label. Fork pull requests
    # always get the hosted label; see the Windows job for why that guard is
    # not the boundary on its own.
    # The adversarial suite's Electron control runs the dev Electron binary
    # (never the packaged app), so the runner needs a logged-in GUI session.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.AVE_MACOS_RUNNER && fromJSON(vars.AVE_MACOS_RUNNER) || 'self-hosted' }}
    env:
      # A self-hosted runner's home is the owner's own: keep bun's package
      # cache and Electron's download cache in the workspace.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
          persist-credentials: false
      # Self-hosted machines have no preinstalled toolcache; install Node into
      # the runner's own tool cache instead of relying on a system Node. The
      # runner check and the docs classifier below both run on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require the runner variable
        shell: bash
        working-directory: ave
        env:
          AVE_MACOS_RUNNER: ${{ vars.AVE_MACOS_RUNNER }}
        run: bash .github/scripts/require-runner-vars.sh AVE_MACOS_RUNNER
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # The pinned bun from .bun-version goes under RUNNER_TEMP, never into
      # the owner's own bun home on a self-hosted runner; on Windows it is a
      # checksum-verified release download (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Every later step (install scripts, the tests and the post-job cache
      # saves) sees a home and a temp directory under RUNNER_TEMP, which the
      # runner empties around every job, instead of the owner's home, its
      # ~/.ave and ~/Library, and the per-user /var/folders temp directory.
      - name: Isolate home and temp directories in the runner temp
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        run: node ave/.github/scripts/isolate-job-home.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      # The Python smoke's harness runs `uv pip install` with the app's uv, and
      # a restored node_modules cache skips the postinstall that fetches it.
      - name: Ensure uv toolchain
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5) here is not actions/setup-python:
      # on macOS that action runs `sudo installer -pkg … -target /` into
      # /Library/Frameworks, outside the workspace of the owner's machine. With
      # AVE_SMOKE_PYTHON unset the harness has the uv above install a managed
      # 3.12 under node_modules/.cache/ave-python-smoke and discovers it with
      # `--managed-python`, so no step relies on the machine's own python3.
      # The plugin-confinement cases need a LIVE sandbox, and the Linux job that
      # runs the whole suite has no bubblewrap — so there they return early and
      # pass without measuring anything. macOS needs no backend install; Linux
      # gets its own job below, which installs the backend first.
      # `AVE_REQUIRE_SANDBOX_CASES=1` is what stops that from being a silent
      # arrangement: if the sandbox cannot initialize here, the cases FAIL
      # instead of reporting a measurement they never took.
      - name: Run macOS permission regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          AVE_REQUIRE_SANDBOX_CASES: "1"
        run: >
          bun run test --
          src/plugins/isolation/__tests__/confined-plugin-child.test.ts
          src/plugins/isolation/__tests__/adversarial-escapes.test.ts
          src/hooks/__tests__/bundled-hook-asrt.smoke.test.ts
          src/permissions/__tests__/allowed-directories.test.ts
          src/permissions/__tests__/permission-manager-meta-override.test.ts
          src/tools/__tests__/registry-meta-governance.test.ts
          src/tools/__tests__/executor-rationale-batch.test.ts
          src/tools/pipeline/__tests__/rationale-host-coordinator.test.ts
          src/tools/pipeline/__tests__/rationale-host-service.test.ts
          src/tools/pipeline/__tests__/rationale-invocation-journal.test.ts
          src/tools/pipeline/__tests__/rationale-ticket-store.test.ts
          src/engine/turn/__tests__/rationale-real-stack.integration.test.ts
          src/audit/__tests__/hmac-chain.test.ts
          src/audit/__tests__/rationale-audit-adapter.test.ts
          src/data/__tests__/secret-document-store.test.ts

  linux-confinement-tests:
    name: Linux confinement path tests
    # The architecture of `build-and-test`, so the native-module cache key below
    # and ASRT's `arm64` seccomp filter both apply.
    # Runner from repo variable AVE_LINUX_RUNNER (JSON label array, e.g.
    # ["self-hosted","Linux","ARM64","ave"]); unset = hosted fallback, and a
    # fork pull request always gets the hosted label. Private repo only: unset
    # AVE_LINUX_RUNNER before the repo goes public.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # ASRT's Linux backend checks for `bwrap` and `socat` and scans deny paths
      # with `rg`; its README lists all three. `xvfb` is for the adversarial
      # suite's Electron control: a full Electron main process needs a display
      # driver, and `xvfb-run -a` is Electron's documented answer on a headless
      # CI host ("Testing on Headless CI Systems").
      - name: Install the Linux sandbox backend
        if: steps.docs-impact.outputs.docs_only != 'true'
        # A self-hosted runner has no sudo and is provisioned with these
        # already; install only what is missing so both runner kinds pass.
        run: |
          missing=0
          for tool in bwrap socat rg xvfb-run; do
            command -v "$tool" >/dev/null 2>&1 || { echo "missing: $tool"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep xvfb
          else
            echo "bubblewrap, socat, ripgrep and xvfb already installed"
          fi
      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which
      # strips what bubblewrap needs (ASRT README, "Platform-Specific
      # Dependencies"). A runner setting, not a product change: the app never
      # changes a user's sysctl, and on such a host the sandbox fails to
      # initialise and a `process` entry is refused `process-entry-unconfined`.
      - name: Allow unprivileged user namespaces
        if: steps.docs-impact.outputs.docs_only != 'true'
        # Only when the knob exists and is not already 0 (a self-hosted runner
        # has it set at provisioning and has no sudo). The next step proves
        # the namespace either way.
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$knob" ] && [ "$(cat "$knob")" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "unprivileged user namespaces already allowed"
          fi
      # Fails here, with its own message, on a runner that cannot create the
      # namespace — rather than inside a test.
      - name: Prove the sandbox backend
        if: steps.docs-impact.outputs.docs_only != 'true'
        run: bwrap --version && socat -V | head -1 && rg --version | head -1 && bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      # The pinned bun from .bun-version goes under RUNNER_TEMP, never into
      # the owner's own bun home on a self-hosted runner; on Windows it is a
      # checksum-verified release download (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      # The Python smoke's harness runs `uv pip install` with the app's uv, and
      # a restored node_modules cache skips the postinstall that fetches it.
      - name: Ensure uv toolchain
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5): the harness verifies it,
      # installs `mcp` 2.2.0 for it with the uv above and proves the import, so
      # no step relies on the runner image's own python3.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      # With the flag set, a case that cannot initialise the sandbox FAILS
      # instead of returning green, so a green job is a measurement.
      - name: Run Linux confinement regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          AVE_REQUIRE_SANDBOX_CASES: "1"
          AVE_SMOKE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >
          bun run test --
          src/plugins/isolation/__tests__/confined-plugin-child.test.ts
          src/plugins/isolation/__tests__/adversarial-escapes.test.ts
          src/hooks/__tests__/bundled-hook-asrt.smoke.test.ts
