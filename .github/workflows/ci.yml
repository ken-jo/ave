name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v6
        with:
          path: ave
      - name: Clone sibling plugin repos
        env:
          AVE_REPO_READ_TOKEN: ${{ secrets.AVE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo_token="${AVE_REPO_READ_TOKEN:-}"
          if [ -z "$repo_token" ] && gh auth status --hostname github.com >/dev/null 2>&1; then
            repo_token="$(gh auth token)"
          fi
          if [ -z "$repo_token" ]; then
            echo "::warning::No AVE_REPO_READ_TOKEN or gh auth token available; attempting unauthenticated sibling clones."
          fi
          sibling_ref="${AVE_SIBLING_REPO_REF:-${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}}"
          for slug in ave-plugin-meeting ave-plugin-local-indexer ave-plugin-orion-api ave-plugin-vega-early ave-plugin-hydra ave-plugin-lyra-mail; do
            if [ -d "$slug" ]; then rm -rf "$slug"; fi
            clone_url="https://github.com/former_org/${slug}.git"
            if [ -n "$repo_token" ]; then
              clone_url="https://x-access-token:${repo_token}@github.com/former_org/${slug}.git"
            fi
            if [ -n "$sibling_ref" ] && git ls-remote --exit-code --heads "$clone_url" "$sibling_ref" >/dev/null 2>&1; then
              echo "Cloning ${slug}@${sibling_ref}"
              git clone --depth 1 --branch "$sibling_ref" "$clone_url" "$slug"
            else
              echo "Cloning ${slug}@default"
              git clone --depth 1 "$clone_url" "$slug"
            fi
          done
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: ave
      - run: bun run build
        working-directory: ave
      - name: Remove root-level Bun binary shims before Vitest
        working-directory: ave
        run: rm -f ajv pino
      - run: bun run test
        working-directory: ave

