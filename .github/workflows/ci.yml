  macos-permission-tests:
    name: macOS permission path tests
    concurrency:
      group: ci-platform-${{ github.workflow }}-macos-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Selected backend/global patches and full runs keep the complete native
    # list. Renderer-only patches do not allocate a platform runner.
    needs: build
    if: needs.build.outputs.platform_checks == 'true'
    # GitHub-hosted runner, as every job is; see workflow-runner-policy.ts.
    # The adversarial suite's Electron control runs the dev Electron binary
    # (never the packaged app), so the runner needs a logged-in GUI session.
    runs-on: macos-15
    env:
      # Keep bun's package cache and Electron's download cache in the
      # workspace, under the cache keys below.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      AVE_UV_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.cache/uv-archives
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 2
          persist-credentials: false
      # Pin Node 24 rather than whichever Node the runner image ships. The
      # docs classifier below runs on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./ave/.github/actions/setup-bun
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Every later step (install scripts, the tests and the post-job cache
      # saves) sees a home and a temp directory under RUNNER_TEMP, which the
      # runner empties around every job, instead of the runner user's home, its
      # ~/.ave and ~/Library, and the per-user /var/folders temp directory.
      - name: Isolate home and temp directories in the runner temp
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        run: node ave/.github/scripts/isolate-job-home.mjs
      # node_modules first: the download cache is restored only on its miss
      # (see build-and-test).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: ./ave/.github/actions/cache-runtime-tools
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          repository: ave
      - name: Restore runtime download archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/electron
          key: ${{ runner.os }}-${{ runner.arch }}-runtime-electron-v1-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      # The Python smoke's harness runs `uv pip install` with the app's uv, and
      # a restored node_modules cache skips the postinstall that fetches it.
      - name: Ensure uv toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # Publisher verification is proven against the real codesign and a real
      # official Anthropic release, pinned by version and SHA-256. The binary
      # is read as data by the test and never executed.
      - name: Fetch the pinned Claude Code release for publisher verification
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        env:
          CLAUDE_CODE_RELEASE: "2.1.311"
          CLAUDE_CODE_DARWIN_ARM64_SHA256: "85d8c08707fcfd1e78ffa0204eefbc6ec9e4fe22f375fb2767ef85d957ed3161"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-code-release"
          mkdir -p "$dir"
          curl --fail --silent --show-error --proto '=https' --retry 6 --retry-delay 5 --retry-max-time 180 --output "$dir/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_RELEASE/darwin-arm64/claude"
          echo "$CLAUDE_CODE_DARWIN_ARM64_SHA256  $dir/claude" | shasum -a 256 -c -
          echo "AVE_CLAUDE_CODE_RELEASE_BINARY=$dir/claude" >> "$GITHUB_ENV"
      # The Python smoke's interpreter (§9.7 P5) here is not actions/setup-python:
      # on macOS that action runs `sudo installer -pkg … -target /` into
      # /Library/Frameworks, outside the job's workspace. With
      # AVE_SMOKE_PYTHON unset the harness has the uv above install a managed
      # 3.12 under node_modules/.cache/ave-python-smoke and discovers it with
      # `--managed-python`, so no step relies on the machine's own python3.
      # Native confinement cases need a live sandbox. Both Linux jobs install
      # the backend; this job needs no backend install.
      # `AVE_REQUIRE_SANDBOX_CASES=1` makes confinement jobs fail if the sandbox
      # cannot initialize, instead of passing without taking a measurement.
      # Terminal egress cases route a public destination through a local HTTPS
      # fixture using the trusted upstream setting. The real sandbox and CONNECT
      # approval path remain active without requiring external DNS or traffic.
      - name: Prepare authenticated interpreter mirror
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/python-download-mirror.mjs
      - name: Run macOS permission regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          AVE_REQUIRE_SANDBOX_CASES: "1"
          AVE_REQUIRE_PUBLISHER_FIXTURES: "1"
        run: >
          bun run test --
          src/plugins/isolation/__tests__/confined-plugin-child.test.ts
          src/plugins/isolation/__tests__/adversarial-escapes.test.ts
          src/hooks/__tests__/bundled-hook-asrt.smoke.test.ts
          src/tools/__tests__/session-read-shell.test.ts
          src/tools/__tests__/host-script-policy.test.ts
          src/tools/__tests__/xlsx-edit-sandbox.integration.test.ts
          src/permissions/__tests__/sandbox-control-writes.integration.test.ts
          src/permissions/__tests__/sandbox-shell-sockets.integration.test.ts
          src/permissions/__tests__/sandbox-git-controls.integration.test.ts
          src/permissions/__tests__/egress-terminal-background.integration.test.ts
          src/permissions/__tests__/egress-deny-native.test.ts
          src/permissions/__tests__/egress-token-isolation-native.test.ts
          src/main/terminal/__tests__/terminal-egress-native.test.ts
          test/scripts/asrt-patched-symbols.test.ts
          src/permissions/__tests__/allowed-directories.test.ts
          src/permissions/__tests__/asrt-sandbox.test.ts
          src/permissions/__tests__/permission-manager-meta-override.test.ts
          src/tools/__tests__/registry-meta-governance.test.ts
          src/tools/__tests__/executor-rationale-batch.test.ts
          src/tools/pipeline/__tests__/rationale-host-coordinator.test.ts
          src/tools/pipeline/__tests__/rationale-host-service.test.ts
          src/tools/pipeline/__tests__/rationale-invocation-journal.test.ts
          src/tools/pipeline/__tests__/rationale-ticket-store.test.ts
          src/engine/turn/__tests__/rationale-real-stack.integration.test.ts
          src/audit/__tests__/hmac-chain.test.ts
          src/audit/__tests__/rationale-audit-adapter.test.ts
          src/data/__tests__/secret-document-store.test.ts
          src/main/__tests__/claude-code-authenticity-native.test.ts

  linux-confinement-tests:
    name: Linux confinement path tests
    concurrency:
      group: ci-platform-${{ github.workflow }}-linux-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Selected backend/global patches and full runs keep the complete native
    # list. Renderer-only patches do not allocate a platform runner.
    needs: build
    if: needs.build.outputs.platform_checks == 'true'
    # The architecture of `build-and-test`, so the native-module cache key below
    # and ASRT's `arm64` seccomp filter both apply.
    # GitHub-hosted runner, as every job is; see workflow-runner-policy.ts.
    runs-on: ubuntu-24.04-arm
    env:
      # Parallel runners may share a home; each workspace owns its Bun cache.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      AVE_UV_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/.cache/uv-archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 2
          # No later step pushes or fetches with the job token, so it is not
          # left in .git/config for the test suite's processes to read.
          persist-credentials: false
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # ASRT's Linux backend checks for `bwrap` and `socat` and scans deny paths
      # with `rg`; its README lists all three. `xvfb` is for the adversarial
      # suite's Electron control: a full Electron main process needs a display
      # driver, and `xvfb-run -a` is Electron's documented answer on a headless
      # CI host ("Testing on Headless CI Systems").
      - name: Install the Linux sandbox backend
        if: steps.docs-impact.outputs.docs_only != 'true'
        uses: ./ave/.github/actions/linux-packages
        with:
          packages: bubblewrap socat ripgrep xvfb bash zsh
          commands: bwrap socat rg xvfb-run bash zsh
      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which
      # strips what bubblewrap needs (ASRT README, "Platform-Specific
      # Dependencies"). A runner setting, not a product change: the app never
      # changes a user's sysctl, and on such a host the sandbox fails to
      # initialise and a `process` entry is refused `process-entry-unconfined`.
      - name: Allow unprivileged user namespaces
        if: steps.docs-impact.outputs.docs_only != 'true'
        # Only when the knob exists and is not already 0. The next step proves
        # the namespace either way.
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$knob" ] && [ "$(cat "$knob")" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "unprivileged user namespaces already allowed"
          fi
      # Fails here, with its own message, on a runner that cannot create the
      # namespace — rather than inside a test.
      - name: Prove the sandbox backend
        if: steps.docs-impact.outputs.docs_only != 'true'
        run: bwrap --version && socat -V | head -1 && rg --version | head -1 && bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./ave/.github/actions/setup-bun
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # node_modules first: the download cache is restored only on its miss
      # (see build-and-test).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-workspace-v1-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-workspace-v1-
      - uses: ./ave/.github/actions/cache-runtime-tools
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          repository: ave
      - name: Restore runtime download archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/electron
          key: ${{ runner.os }}-${{ runner.arch }}-runtime-electron-v1-${{ hashFiles('ave/bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      # The Python smoke's harness runs `uv pip install` with the app's uv, and
      # a restored node_modules cache skips the postinstall that fetches it.
      - name: Ensure uv toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5): the harness verifies it,
      # installs `mcp` 2.2.0 for it with the uv above and proves the import, so
      # no step relies on the runner image's own python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      # Release-manifest verification is proven with the real /usr/bin/gpg
      # against Anthropic's official signed manifest, pinned by SHA-256. The
      # key is not hash-pinned: the code under test pins its fingerprint.
      - name: Fetch the pinned Claude Code release metadata for publisher verification
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        env:
          CLAUDE_CODE_RELEASE: "2.1.311"
          CLAUDE_CODE_MANIFEST_SHA256: "d456e7293d621e6e09dd73b1d2a112bef62dae08d1ee44c1065356e64da65c0d"
          CLAUDE_CODE_MANIFEST_SIGNATURE_SHA256: "7cb5c28b0f3fba12a6af07aa38bf1abfc11ef843356c78ed95fc8b5b9f963b8b"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-code-release-metadata"
          mkdir -p "$dir"
          fetch() { curl --fail --silent --show-error --proto '=https' --retry 6 --retry-delay 5 --retry-max-time 180 --output "$dir/$1" "https://downloads.claude.ai/$2"; }
          fetch claude-code.asc keys/claude-code.asc
          fetch manifest.json "claude-code-releases/$CLAUDE_CODE_RELEASE/manifest.json"
          fetch manifest.json.sig "claude-code-releases/$CLAUDE_CODE_RELEASE/manifest.json.sig"
          printf '%s  %s\n' "$CLAUDE_CODE_MANIFEST_SHA256" "$dir/manifest.json" \
            "$CLAUDE_CODE_MANIFEST_SIGNATURE_SHA256" "$dir/manifest.json.sig" | sha256sum -c -
          echo "AVE_CLAUDE_CODE_RELEASE_METADATA=$dir" >> "$GITHUB_ENV"
      # With the flag set, a case that cannot initialise the sandbox FAILS
      # instead of returning green, so a green job is a measurement.
      # Terminal egress cases use the same local HTTPS route fixture as the macOS job.
      - name: Prepare authenticated interpreter mirror
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/python-download-mirror.mjs
      - name: Run Linux confinement regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          AVE_REQUIRE_SANDBOX_CASES: "1"
          AVE_REQUIRE_PUBLISHER_FIXTURES: "1"
          AVE_SMOKE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >
          bun run test --
          test/scripts/asrt-bwrap-ownership.test.ts
          src/permissions/__tests__/linux-sandbox-wrap.test.ts
          src/permissions/__tests__/asrt-sandbox.test.ts
          src/plugins/isolation/__tests__/confined-plugin-child.test.ts
          src/plugins/isolation/__tests__/adversarial-escapes.test.ts
          src/hooks/__tests__/bundled-hook-asrt.smoke.test.ts
          src/tools/__tests__/session-read-shell.test.ts
          src/tools/__tests__/host-script-policy.test.ts
          src/tools/__tests__/xlsx-edit-sandbox.integration.test.ts
          src/permissions/__tests__/egress-deny-native.test.ts
          src/permissions/__tests__/egress-token-isolation-native.test.ts
          src/main/terminal/__tests__/terminal-egress-native.test.ts
          test/scripts/asrt-patched-symbols.test.ts
          src/main/terminal/__tests__/pty-manager-linux-sandbox.test.ts
          src/permissions/__tests__/sandbox-control-writes.integration.test.ts
          src/permissions/__tests__/sandbox-shell-sockets.integration.test.ts
          src/permissions/__tests__/sandbox-git-controls.integration.test.ts
          src/permissions/__tests__/egress-terminal-background.integration.test.ts
          src/main/__tests__/claude-code-authenticity-native.test.ts
