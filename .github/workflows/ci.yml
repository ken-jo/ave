name: CI
# Test-only diffs (collected tests and fixture assets only) run affected tests
# on every PR base and main push, never the full suite. Test helper and setup
# modules, the Vitest config, config/, scripts/ and .github/ are never
# test-only. Main pushes use trusted selection over before..HEAD, like
# non-integration PRs;
# uncertainty falls back to full. Integration-base PRs keep traced selection.
# Non-test-only category PRs, release tags, nightly schedules and manual
# dispatches run the full suite. Coverage runs only on schedule and dispatch.
# scripts/run-ci-suite.mjs owns the rule and records it in the job summary.
on:
  pull_request:
    branches: [main, "integration/**"]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # 18:00 UTC is 03:00 KST, outside the owner's working hours.
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The event is part of the group so the nightly run on main never cancels,
  # and is never cancelled by, the run of a push to main. A push groups
  # by ref and commit, so a second merge never cancels the first merge's
  # run, and tagging a merge commit (a push of the same sha to a tag
  # ref) never cancels that commit's main run. A pull
  # request still cancels its own superseded run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && format('{0}-{1}', github.ref, github.sha) || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, typecheck and plan the suite
    # Every job in every workflow runs on a GitHub-hosted runner
    # (src/__tests__/support/workflow-runner-policy.ts fails on anything
    # else). Hosted runners are ephemeral VMs, so a fork's package.json
    # postinstall cannot persist on, or read state from, any machine of the
    # owner's. The repository must also register no self-hosted runner: a
    # fork pull request runs its own edited copy of this file and could name
    # one. ARM64 keeps native-module
    # (better-sqlite3 etc.) parity with the dev fleet. Core CI is deliberately
    # secret-free and does not clone private sibling repositories;
    # cross-repository integration belongs to trusted default-branch
    # repository_dispatch workflows.
    runs-on: ubuntu-24.04-arm
    outputs:
      docs_only: ${{ steps.docs-impact.outputs.docs_only }}
      # One shard when the plan step did not run (a docs-only change), so the
      # matrix below always reads a list.
      shards: ${{ steps.plan.outputs.shards || '[1]' }}
    env:
      # Parallel runners may share a home; each workspace owns its Bun cache.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
          # No later step pushes or fetches with the job token, so it is not
          # left in .git/config for the test suite's processes to read.
          persist-credentials: false
      - name: Classify documentation impact
        id: docs-impact
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check documentation diff
        if: steps.docs-impact.outputs.docs_only == 'true'
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA..HEAD"
      - name: Check documentation policy
        if: steps.docs-impact.outputs.docs_only == 'true'
        working-directory: ave
        run: node --import ./scripts/lib/document-consumer-guard.mjs --test test/scripts/check-asrt-version-claims.test.mjs && node scripts/check-asrt-version-claims.mjs && node --import ./scripts/lib/document-consumer-guard.mjs --test test/scripts/retired-name.test.mjs && node scripts/check-retired-name.mjs
      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Cache the built node_modules (Electron dist + electron-rebuilt native
      # modules) keyed on os+arch+lockfile. On a hit, `bun install` restores the
      # ABI-correct binaries without re-downloading Electron or recompiling
      # better-sqlite3/node-pty. Exact-key only — a lockfile change (which pins
      # the Electron version) misses and rebuilds, so a stale ABI never leaks in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      # Bun's download cache only feeds an install that has to fetch packages.
      # After an exact node_modules hit `bun install` finds every package in
      # place (2-3 s in every measured run), so restoring this cache there was
      # ~45 s of download for nothing. It is restored, and saved, only when
      # node_modules missed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-workspace-v1-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-workspace-v1-
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      - name: Restore webpack cache
        id: webpack-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/.cache/webpack
          key: ${{ runner.os }}-${{ runner.arch }}-ci-webpack-v1-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}-${{ hashFiles('ave/webpack.config.cjs', 'ave/tsconfig*.json') }}-${{ hashFiles('ave/src/**', 'ave/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-webpack-v1-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}-${{ hashFiles('ave/webpack.config.cjs', 'ave/tsconfig*.json') }}-
            ${{ runner.os }}-${{ runner.arch }}-ci-webpack-v1-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}-
      # uv is fetched to resources/ (outside node_modules) by the postinstall,
      # which bun skips when node_modules is already satisfied from cache. Ensure
      # it explicitly — fetch-uv is idempotent (no-op when already present).
      - name: Ensure uv toolchain
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5): the harness verifies it,
      # installs `mcp` 2.2.0 for it with the uv above and proves the import, so
      # no step relies on the runner image's own python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      # The steps above are preconditions, not gates: without a checkout, an
      # install, the uv toolchain and the smoke's Python there is nothing to
      # verify, so a red job there genuinely means "could not verify". From
      # here down the job compiles and builds the product, and plans the suite
      # the Vitest shards run — and the
      # repository-hygiene gates run after all of it, in build-and-test, which
      # needs this job and every Vitest shard. The block above them says why
      # they are there and not above.
      - name: Typecheck
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run typecheck
      - name: Verify Windows sandbox helper pins
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: node scripts/check-srt-win-integrity.cjs
      # `typecheck` covers production sources only — both tsconfigs exclude
      # `src/**/__tests__/**`, so before this step a test could reference an unimported
      # symbol and reach CI green. This is the ratchet for the rest: new test files are
      # fully checked, existing ones may only improve. The self-test runs beside it
      # because a ratchet that silently stops comparing reports green forever.
      - name: Typecheck tests (baseline ratchet)
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:typecheck-tests:self-test && bun run check:typecheck-tests
      # Postinstall leaves native modules on Electron's ABI. The shared Vitest
      # runner uses ELECTRON_RUN_AS_NODE, so tests and the desktop runtime consume
      # that same binary without an in-place Node-ABI rebuild.
      - run: bun run build
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        env:
          AVE_BUILD_MINIFIER: esbuild
      # Plan once: the shards below run this plan instead of planning again,
      # so every shard splits the same file list. A full run without
      # coverage gets FULL_RUN_SHARDS shards; an affected selection and a
      # coverage run get one (scripts/run-ci-suite.mjs).
      - name: Plan the suite
        id: plan
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        # The same base the documentation classifier diffs from. A push plans
        # over everything since `before`, so a multi-commit or rebase-merged
        # push is classified as a whole; scripts/run-ci-suite.mjs plans full
        # when it is missing, zero or not an ancestor of HEAD. A pull request
        # plans over its merge commit's first parent.
        env:
          AVE_CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-plan"
          node scripts/run-ci-suite.mjs --write-plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
      - name: Upload the build for the Vitest shards
        if: steps.docs-impact.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build
          path: ave/dist
          if-no-files-found: error
          retention-days: 1
      - name: Upload the suite plan
        if: steps.docs-impact.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/ci-plan.json
          if-no-files-found: error
          retention-days: 1

  vitest:
    name: Vitest shard ${{ matrix.shard }}
    needs: build
    if: needs.build.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards || '[1]') }}
    env:
      # Parallel runners may share a home; each workspace owns its Bun cache.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
          # No later step pushes or fetches with the job token.
          persist-credentials: false
      # Install and save package archives before dependency scripts can run.
      # The suite's sandbox tests need bwrap, socat and rg, and the terminal's
      # real-shell tests (typing, and the differential check of what zsh and
      # bash run against what the permission rules read) need zsh, which the
      # Ubuntu image lacks. The build job and build-and-test run no tests, so
      # only the shards install them.
      - name: Install Linux sandbox and real-shell tools
        uses: ./ave/.github/actions/linux-packages
        with:
          packages: bubblewrap socat ripgrep zsh
          commands: bwrap socat rg zsh
      # Only when the knob exists and is not already 0. The next step proves
      # the namespace either way.
      - name: Allow unprivileged user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$knob" ] && [ "$(cat "$knob")" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "unprivileged user namespaces already allowed"
          fi
      # Fails here, with its own message, on a runner that cannot create the
      # namespace — rather than inside a test.
      - name: Prove the sandbox backend
        run: bwrap --version && socat -V | head -1 && rg --version | head -1 && bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      - uses: ./ave/.github/actions/setup-bun
        with:
          bun-version-file: ave/.bun-version
      # Cache the built node_modules (Electron dist + electron-rebuilt native
      # modules) keyed on os+arch+lockfile. On a hit, `bun install` restores the
      # ABI-correct binaries without re-downloading Electron or recompiling
      # better-sqlite3/node-pty. Exact-key only — a lockfile change (which pins
      # the Electron version) misses and rebuilds, so a stale ABI never leaks in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      # Bun's download cache only feeds an install that has to fetch packages.
      # After an exact node_modules hit `bun install` finds every package in
      # place (2-3 s in every measured run), so restoring this cache there was
      # ~45 s of download for nothing. It is restored, and saved, only when
      # node_modules missed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-workspace-v1-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-workspace-v1-
      - run: bun install --frozen-lockfile
        working-directory: ave
      # uv is fetched to resources/ (outside node_modules) by the postinstall,
      # which bun skips when node_modules is already satisfied from cache. Ensure
      # it explicitly — fetch-uv is idempotent (no-op when already present).
      - name: Ensure uv toolchain
        working-directory: ave
        run: node scripts/fetch-uv.mjs
      # The Python smoke's interpreter (§9.7 P5): the harness verifies it,
      # installs `mcp` 2.2.0 for it with the uv above and proves the import, so
      # no step relies on the runner image's own python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      # The build job's dist/, so this shard tests the bytes that job built
      # and typechecked instead of building again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-build
          path: ave/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Remove root-level Bun binary shims before Vitest
        working-directory: ave
        run: rm -f ajv pino
      - name: Run the suite (coverage gate on nightly and dispatch)
        # The suite resolves entirely from ave/src. Sibling slugs appear
        # only as fixtures or mocked installer inputs.
        #
        # Test-only diffs always keep changed tests, fixture readers, triggered
        # locks and the must-run set; a test helper or setup module is never
        # test-only and runs full off integration bases. Other main pushes use trusted selection
        # over the push's before..HEAD diff, with uncertainty falling back to full.
        # Non-test-only category merges, tags, schedule and dispatch run full.
        # Integration-base PRs retain best traced selection on uncertainty and
        # fail on an unresolved diff. Local pre-push is unchanged.
        # Only schedule and dispatch instrument coverage and enforce thresholds.
        # The step summary names the mode and the rule that chose it.
        #
        # `check:test-coverage`, not `check:test-quality`: that composite runs
        # `check:test-duplicates` first, so a duplicated test helper would end
        # this step before a single test executed — the same masking defect one
        # layer down, in an npm script instead of a workflow. This job calls the
        # composite's two halves separately, the duplicate scan last;
        # `check:test-quality` stays as the local one-shot README.md documents.
        #
        # Three workers, not the config's four: a standard hosted runner has
        # four vCPUs, and each Vitest worker spawns subprocesses of its own.
        #
        # This job is one shard of the plan the build job wrote:
        # AVE_CI_PLAN_FILE is that plan, AVE_CI_SHARD this shard's place in
        # the matrix (`vitest --shard`); a one-shard matrix runs it whole.
        env:
          AVE_REQUIRE_SANDBOX_CASES: "1"
          AVE_SMOKE_PYTHON: ${{ steps.python.outputs.python-path }}
          AVE_VITEST_MAX_WORKERS: "3"
          AVE_CI_PLAN_FILE: ${{ runner.temp }}/ci-plan/ci-plan.json
          AVE_CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run test:ci
        working-directory: ave

  build-and-test:
    # The required check on main. It reports success only when the build job
    # and every Vitest shard succeeded (a docs-only change skips the shards
    # and checks its documents in the build job), then runs the repository
    # hygiene gates. `always()` keeps it running when a needed job failed
    # and when the run was cancelled, so a red or cancelled shard turns this
    # check red instead of skipping it: a skipped job reports success to
    # branch protection. Its first step is `always()` too, so a cancelled run
    # cannot skip it either, and it fails on any upstream result other than
    # success (cancelled and skipped included).
    needs: [build, vitest]
    if: always()
    # Every job in every workflow runs on a GitHub-hosted runner
    # (src/__tests__/support/workflow-runner-policy.ts fails on anything
    # else). Hosted runners are ephemeral VMs, so a fork's package.json
    # postinstall cannot persist on, or read state from, any machine of the
    # owner's. The repository must also register no self-hosted runner: a
    # fork pull request runs its own edited copy of this file and could name
    # one. ARM64 keeps native-module
    # (better-sqlite3 etc.) parity with the dev fleet. Core CI is deliberately
    # secret-free and does not clone private sibling repositories;
    # cross-repository integration belongs to trusted default-branch
    # repository_dispatch workflows.
    runs-on: ubuntu-24.04-arm
    env:
      # Parallel runners may share a home; each workspace owns its Bun cache.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - name: Require the build and every Vitest shard
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          DOCS_ONLY: ${{ needs.build.outputs.docs_only }}
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::the build job ended $BUILD_RESULT"
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            if [ "$VITEST_RESULT" != "skipped" ]; then
              echo "::error::a docs-only change ran Vitest shards ($VITEST_RESULT)"
              exit 1
            fi
            exit 0
          fi
          if [ "$VITEST_RESULT" != "success" ]; then
            echo "::error::the Vitest shards ended $VITEST_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.build.outputs.docs_only != 'true'
        with:
          path: ave
          fetch-depth: 0
          # No later step pushes or fetches with the job token.
          persist-credentials: false
      - uses: ./ave/.github/actions/setup-bun
        if: needs.build.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Cache the built node_modules (Electron dist + electron-rebuilt native
      # modules) keyed on os+arch+lockfile. On a hit, `bun install` restores the
      # ABI-correct binaries without re-downloading Electron or recompiling
      # better-sqlite3/node-pty. Exact-key only — a lockfile change (which pins
      # the Electron version) misses and rebuilds, so a stale ABI never leaks in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        if: needs.build.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      # Bun's download cache only feeds an install that has to fetch packages.
      # After an exact node_modules hit `bun install` finds every package in
      # place (2-3 s in every measured run), so restoring this cache there was
      # ~45 s of download for nothing. It is restored, and saved, only when
      # node_modules missed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.build.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-workspace-v1-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-workspace-v1-
      - run: bun install --frozen-lockfile
        if: needs.build.outputs.docs_only != 'true'
        working-directory: ave
      # Repository hygiene: manifests, baseline ledgers, and the self-tests of
      # the gates that read them. Nothing below compiles or runs the product; a
      # failure here means a bookkeeping file is stale, not that the code is
      # broken.
      #
      # Two of the four used to run ahead of Typecheck; the duplicate scan ran
      # ahead of the suite from inside `check:test-quality`, and the sunset
      # ledger ahead of every compile from inside `bun run build`. Two changes
      # landed the same day — one declared every tracked image in a manifest,
      # the other deleted some of those images — and the merge left the
      # manifest stale. The gate failed, and because a job stops at its first
      # failed step, Typecheck, the test-typecheck ratchet, the build and the
      # entire suite were skipped. `main` carried a red check that meant
      # "nothing was verified", which is indistinguishable from "something was
      # verified and failed" and so is worse than having no gate at all.
      # Running these four after every verification step ends that for them.
      # It does not end it for the repository: the paragraph below names the
      # commands where the same shape survives, inside `bun run build`.
      #
      # Last *in this job* rather than in a job of their own, because the check
      # name `build-and-test` is one of the two required status checks on
      # `main`; the other is `naming-gate`. Read the current list with
      #   gh api repos/ken-jo/ave/branches/main/protection \
      #     --jq .required_status_checks.contexts
      # A separate job reports under a separate check name, and a name branch
      # protection does not list cannot block a merge. That is measured, not
      # feared: an earlier revision of this change put these three in a
      # `repo-hygiene` job, and on a commit carrying a deliberately stale
      # manifest entry both required contexts reported success. Two checks did
      # go red on it — `Repository hygiene gates` here and a web-ci.yml job —
      # and neither name is in the required list,
      # so neither stood between that manifest and a merge. Two jobs is the
      # better shape and stays available — but the required-contexts list has to
      # gain the new name in the same change, or the split trades a masking bug
      # for a silent hole.
      #
      # Within this trailing group the first failure still skips the rest: a red
      # Knip gate leaves the duplicate and sunset scans reported as
      # skipped. That is accepted, not overlooked. Every verification step has
      # already run and reported its own result by then, and the failing step
      # names itself, so the red says one true thing — a ledger is stale, and
      # this is the first one. Reporting all four independently would need `if:
      # always()` on each, which also runs them after a genuine build failure
      # and chains bookkeeping noise onto a red that already has its answer, or
      # one runner per gate.
      #
      # What this ordering does NOT reach: `bun run build` above is one workflow
      # step and twenty commands, and fourteen of those assert rather than
      # compile. Seven of the fourteen — `check:import-cycles`,
      # `check-generated-assets`, `check:plugin-host-protocol-schema`,
      # `check:plugin-host-protocol-mirror`, `check:plugin-host-protocol-client`,
      # `check:i18n-catalog`, `check:i18n-barrels` — sit ahead of a later
      # compile command inside the composite, and all fourteen sit ahead of the
      # suite in this job, so any of them can fail the build step and skip the
      # steps after it. That residual is deliberate and bounded: each reads
      # either the sources being compiled or the bytes the build itself just
      # wrote, and a local `bun run build` is where their drift has to surface.
      # `check:sunset-inventory` was the one that did not fit that description —
      # it reads a hand-written ledger naming source paths that any unrelated
      # change can delete, the same shape as the manifest incident above — so it
      # left the composite and runs here instead. Measured on this tree before
      # the move: one nonexistent path added to the inventory made `bun run
      # build` exit 1 at `[sunset-inventory]`, with clean-dist, build:icons,
      # build:main and build:webpack never reached.
      #
      # `src/__tests__/packaging-discipline-source.test.ts` fails if any job in
      # .github/workflows/ puts one of these gates ahead of a compile or test
      # step, if these gates leave `build-and-test`, if one of them re-enters
      # the `build` composite, and if the set of asserting commands inside that
      # composite changes without the list above changing with it.
      # `check:gate-core` is the one inventory of the gates both CI and the
      # pre-push hook (scripts/hooks/run-local-checks.mjs) run: the Knip
      # baseline, the duplicate-helper scan, the sunset ledger, the
      # single-source shape ledger, the ASRT capability claims, and the
      # retired-name gate (check:retired-name). The two callers
      # used to list them separately and had drifted. The gates below it are
      # CI-only on purpose — the Knip self-test costs more than a pre-push
      # budget allows — and
      # `check:test-coverage` above is CI-only for the same reason.
      - name: Remove root-level Bun binary shims before the hygiene gates
        if: needs.build.outputs.docs_only != 'true'
        working-directory: ave
        run: rm -f ajv pino
      - name: Core hygiene gates
        if: needs.build.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:gate-core && bun run test:knip-gate

  windows-permission-tests:
    name: Windows permission path tests
    # A pull request into an integration/* category branch runs only
    # build-and-test; this job runs for pull requests into main and every
    # event (main push, tag, schedule, dispatch). These jobs run only the
    # explicit platform regression files below, never the whole suite.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    # GitHub-hosted runner, as every job is; see workflow-runner-policy.ts.
    # The runner needs Git for Windows (bash) and the C++ build tools that
    # scripts/build-windows-job.ps1 finds through vswhere. Pinned to
    # windows-2025, the image the release matrix builds the installer on, so
    # a windows-latest rollover cannot test one image and ship another.
    runs-on: windows-2025
    env:
      # Keep bun's package cache and Electron's download cache in the
      # workspace, under the cache keys below.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      # Seven native-process suites start together on this 4-vCPU runner; at
      # 4 workers their cold PowerShell and helper starts stall each other.
      AVE_VITEST_MAX_WORKERS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ave
          fetch-depth: 0
          persist-credentials: false
      # Pin Node 24 rather than whichever Node the runner image ships. The
      # docs classifier below runs on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify documentation impact
        id: docs-impact
        shell: bash
        working-directory: ave
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node scripts/hooks/classify-docs-diff.mjs "$BASE_SHA" HEAD "$EVENT_NAME" >> "$GITHUB_OUTPUT"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      # The pinned bun from .bun-version goes under RUNNER_TEMP, not the runner
      # user's bun home; on Windows it is a checksum-verified release download
      # (see the action).
      - uses: ./ave/.github/actions/setup-bun
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          bun-version-file: ave/.bun-version
      # Every later step (install scripts, the Windows helper checks, the
      # tests and the post-job cache saves) sees a home and a temp directory
      # under RUNNER_TEMP, which the runner empties around every job, instead
      # of the runner user's profile and %LOCALAPPDATA%\Temp.
      - name: Isolate home and temp directories in the runner temp
        if: steps.docs-impact.outputs.docs_only != 'true'
        shell: bash
        run: node ave/.github/scripts/isolate-job-home.mjs
      # node_modules first: the download cache is restored only on its miss
      # (see build-and-test).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        if: steps.docs-impact.outputs.docs_only != 'true'
        with:
          path: ave/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('ave/bun.lock', 'ave/patches/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.docs-impact.outputs.docs_only != 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bun
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('ave/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - run: bun install --frozen-lockfile
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
      - name: Verify native background process ownership
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        # Windows PowerShell ships with every Windows install; the default
        # shell depends on whether PowerShell 7 is present.
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1 -FailureFixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-job.mjs
      # Folder sources classify a drive letter from its MS-DOS device mapping
      # without opening the drive (design multi-source-git-marketplace.md §18.4.1).
      - name: Verify Windows folder classification
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        # Windows PowerShell ships with every Windows install; the default
        # shell depends on whether PowerShell 7 is present.
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-job.ps1 -Helper path-kind
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-path-kind.mjs
      # The tag build runs `bun run build` on Windows, and this check is part of
      # it: there the generator finds its sources through Windows path spellings
      # (drive letters, `\` separators), and must still produce the same bytes.
      - name: Plugin host protocol schema matches its sources
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: bun run check:plugin-host-protocol-schema
      - name: Provision sandbox for native permission tests
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Native sandbox provisioning requires an elevated runner'
          }
          node scripts/check-srt-win-integrity.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = Join-Path $PWD 'node_modules/@anthropic-ai/sandbox-runtime/vendor/srt-win/x64/srt-win.exe'
          & $helper install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = & $helper user status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$status.user.exists -or !$status.cred_present) {
            throw 'Native sandbox provisioning did not produce a usable account'
          }
      - name: Run Windows permission regressions
        if: steps.docs-impact.outputs.docs_only != 'true'
        working-directory: ave
        run: >
          bun run test --
          src/permissions/__tests__/asrt-sandbox.test.ts
