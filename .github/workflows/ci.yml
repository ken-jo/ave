name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v6
        with:
          path: ave
      - name: Clone sibling plugin repos
        # Self-hosted runner has gh CLI authenticated as ubuntu user (repo scope).
        # We use that token instead of GitHub App auth — the App is install-pinned
        # to a different repo set and cannot be modified without org-owner UI access.
        run: |
          set -euo pipefail
          GH_TOKEN=$(gh auth token)
          for slug in ave-plugin-meeting ave-plugin-pyxis ave-plugin-orion-api ave-plugin-vega-early ave-plugin-hydra ave-plugin-lyra-mail; do
            if [ -d "$slug" ]; then rm -rf "$slug"; fi
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/former_org/${slug}.git" "$slug"
          done
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: ave
      - name: Check plugin SDK drift
        run: AVE_HOST_TYPES_PATH="$PWD/src/plugins/types.ts" bun run --cwd packages/plugin-sdk check:drift
        working-directory: ave
      - run: bun run build
        working-directory: ave
      - run: bunx vitest run
        working-directory: ave


