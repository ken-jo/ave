name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: ave
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-meeting
          path: ave-plugin-meeting
          token: ${{ secrets.HOST_READ_TOKEN }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-post
          path: ave-plugin-lyra-post
          token: ${{ secrets.HOST_READ_TOKEN }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-pyxis
          path: ave-plugin-pyxis
          token: ${{ secrets.HOST_READ_TOKEN }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-cal
          path: ave-plugin-lyra-cal
          token: ${{ secrets.HOST_READ_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Stub sibling plugin packages for CI
        run: |
          for pkg in meeting email pageindex calendar; do
            dir="../ave-plugin-$pkg"
            mkdir -p "$dir/dist"
            printf '{"name":"@ave/plugin-%s","version":"0.0.0","main":"dist/hostPlugin.js"}\n' "$pkg" > "$dir/package.json"
            touch "$dir/dist/hostPlugin.js"
          done
      - run: bun install --frozen-lockfile
        working-directory: ave
      - run: bun run build
        working-directory: ave
      - run: bunx vitest run
        working-directory: ave
