name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ave
          submodules: recursive
      - name: Generate plugin read token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: former_org
          repositories: ave-plugin-meeting,ave-plugin-lyra-post,ave-plugin-pyxis,ave-plugin-lyra-cal
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-meeting
          path: ave-plugin-meeting
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-post
          path: ave-plugin-lyra-post
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-pyxis
          path: ave-plugin-pyxis
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-cal
          path: ave-plugin-lyra-cal
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
      - name: Build plugin-sdk submodule
        run: |
          cd ave/packages/plugin-sdk
          bun install --frozen-lockfile
          bun run build
      - run: bun install --frozen-lockfile
        working-directory: ave
      - run: bun run build
        working-directory: ave
      - run: bunx vitest run
        working-directory: ave


