name: Naming Gate (process-metadata + home-path)

# 두 개의 독립 job. 첫 번째(naming-gate)는 diff-based — PR 의 변경분만 검사한다.
# 기존 위반은 grandfather; sweep PR 으로 별도 제거. 두 번째(home-path-gate)는
# whole-tree 이며, 그 이유는 해당 job 설명에 있다.
#
# 두 job 은 서로 독립이다 — 한 job 의 실패가 다른 job 의 판정을 가리지 않는다.
# 같은 job 안의 step 으로 이어 붙이면 앞 step 실패가 뒤 step 을 skip 시키고,
# 리뷰어는 빨간 체크 하나를 보고 "검사 하나가 걸렸다" 로 읽지만 실제로는
# 나머지 검사가 아예 돌지 않은 상태다.
#
# 1. naming-gate — process-derived 메타데이터(H1/H2, Phase-N, test-double
#    prefix, Tier-as-process audit key, version suffix, PR-number fixture path)
#    가 식별자/파일명/주석/shipped document 에 새로 들어오는 것을 차단한다.
#    규칙 원문(positive form)은 `AGENTS.md` > `Naming`. 이 gate 가 검사하지
#    *않는* 것도 그 문서가 reviewer 규칙으로 명시한다 — grep 이 도메인 의미와
#    process 의미를 구분할 수 없는 단어는 패턴에서 빼고 규칙 문서에 남긴다.
#    검사 본체는 `.github/scripts/naming-gate.sh` 한 벌로만 존재하며 CI 밖에서도
#    실행할 수 있다. `naming-gate-selftest.sh` 가 synthetic diff 로 그 동작을
#    고정하고 같은 job 에서 함께 돌기 때문에, grep 프로그램의 회귀는 그것을
#    유발한 PR 에서 바로 실패한다.
#
# 2. home-path-gate — 이 저장소는 PUBLIC 이다. 절대 홈 경로(`/Users/<계정>`,
#    `/home/<계정>`, `C:\Users\<계정>`, 그리고 agent 도구가 쓰는 dash-encoded
#    형태)에 박힌 *개인 계정명* 을 막는다. 1 번 job 과 달리 **whole-tree**
#    이다: 홈 경로는 기계적으로 치환 가능해서 grandfather 할 이유가 없고,
#    diff-only 는 "이 PR 이 안 늘렸다" 만 말할 뿐 "트리가 깨끗하다" 는 말하지
#    못한다. 판정은 deny-list 가 아니라 allow-list — 아직 기여하지 않은 사람의
#    계정명을 미리 알 수 없으므로, fixture 가 쓸 수 있는 synthetic 계정만
#    열거하고 나머지는 전부 실패시킨다. 검사 본체와 self-test 는
#    `.github/scripts/home-path-gate.sh` 한 파일에 함께 있다 (self-test 가
#    위반 계정명을 런타임에 조립하므로 스크립트 자신이 첫 위반이 되지 않고,
#    따라서 gate 를 자기 스캔에서 제외하는 구멍도 필요 없다).

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  naming-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Self-test the gate
        run: .github/scripts/naming-gate-selftest.sh

      - name: Check this PR's diff
        run: |
          base_sha=$(git merge-base origin/${{ github.base_ref }} HEAD)
          .github/scripts/naming-gate.sh "$base_sha" HEAD

  home-path-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the gate
        run: .github/scripts/home-path-gate.sh --selftest

      - name: Scan the whole tree for personal home paths
        run: .github/scripts/home-path-gate.sh
