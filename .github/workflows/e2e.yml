name: Playwright E2E (on-demand)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test (default: main)'
        required: false
        default: main
jobs:
  e2e:
    name: Playwright E2E (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: ave
          submodules: recursive
      - name: Generate plugin read token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: former_org
          repositories: ave-plugin-meeting,ave-plugin-lyra-post,ave-plugin-pyxis,ave-plugin-lyra-cal
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-meeting
          path: ave-plugin-meeting
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-post
          path: ave-plugin-lyra-post
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-pyxis
          path: ave-plugin-pyxis
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        with:
          repository: former_org/ave-plugin-lyra-cal
          path: ave-plugin-lyra-cal
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
      - name: Build plugin-sdk submodule
        run: |
          cd ave/packages/plugin-sdk
          bun install --frozen-lockfile
          bun run build
      - name: Install plugin dependencies
        run: |
          bun install --frozen-lockfile --cwd ../ave-plugin-pyxis
          bun install --frozen-lockfile --cwd ../ave-plugin-meeting
          bun install --frozen-lockfile --cwd ../ave-plugin-lyra-post
          bun install --frozen-lockfile --cwd ../ave-plugin-lyra-cal
        working-directory: ave
      - name: Build all plugins
        run: bun run prepare:plugins
        working-directory: ave
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ave
      - name: Build app
        run: bun run build
        working-directory: ave
      - name: Install Playwright system deps for Electron
        run: bunx playwright install --with-deps chromium
        working-directory: ave
      - name: Run Playwright E2E tests
        run: xvfb-run --auto-servernum bunx playwright test
        working-directory: ave
        env:
          CI: "true"
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ave/playwright-report/
            ave/test-results/
          retention-days: 7
