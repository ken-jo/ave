name: Playwright E2E (on-demand)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test (default: main)'
        required: false
        default: main
jobs:
  e2e:
    name: Playwright E2E (Electron)
    runs-on: [self-hosted, Linux, ARM64, oracle]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: ave
      - name: Clone sibling plugin repos
        run: |
          set -euo pipefail
          GH_TOKEN=$(gh auth token)
          for slug in ave-plugin-meeting ave-plugin-pyxis ave-plugin-orion-api ave-plugin-vega-early ave-plugin-hydra ave-plugin-lyra-mail; do
            if [ -d "$slug" ]; then rm -rf "$slug"; fi
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/former_org/${slug}.git" "$slug"
          done
      - uses: oven-sh/setup-bun@v2
      - name: Install plugin dependencies
        run: |
          bun install --frozen-lockfile --cwd ../ave-plugin-pyxis
          bun install --frozen-lockfile --cwd ../ave-plugin-meeting
          bun install --frozen-lockfile --cwd ../ave-plugin-orion-api
          bun install --frozen-lockfile --cwd ../ave-plugin-vega-early
          bun install --frozen-lockfile --cwd ../ave-plugin-hydra
          bun install --frozen-lockfile --cwd ../ave-plugin-lyra-mail
        working-directory: ave
      - name: Build all plugins
        run: bun run prepare:plugins
        working-directory: ave
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ave
      - name: Check plugin SDK drift
        run: bun run --cwd packages/plugin-sdk check:drift
        working-directory: ave
      - name: Build app
        run: bun run build
        working-directory: ave
      - name: Install Playwright system deps for Electron
        run: bunx playwright install --with-deps chromium
        working-directory: ave
      - name: Run Playwright E2E tests
        run: xvfb-run --auto-servernum bunx playwright test
        working-directory: ave
        env:
          CI: "true"
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ave/playwright-report/
            ave/test-results/
          retention-days: 7
