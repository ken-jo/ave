name: Build Installers

on:
  workflow_dispatch:
    inputs:
      installer_scope:
        description: Build all platforms or validate only on a disposable hosted Windows runner
        required: false
        default: all
        type: choice
        options:
          - all
          - windows-disposable
      skip_code_sign:
        description: Build unsigned internal installers
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      # Proves the contract bundle pipeline (build, keyless signature, R2
      # write-once upload) under _ci-probe/contract/ and deletes it again,
      # only from main, without building installers. See publish-contract.
      contract_probe:
        description: Build, sign, upload and delete a probe contract bundle (main only)
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*.*.*"

# One build per ref at a time on the shared self-hosted runners. GitHub keeps
# one running and at most one pending run per group: cancel-in-progress: false
# protects only the running build, and a newer run cancels the pending one
# rather than queueing behind it.
concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Public tag semantics are verified from the immutable event SHA. The profile
  # never controls secret injection; public tag secrets are fixed in workflow.
  release-profile:
    name: Verify immutable unsigned release profile
    outputs:
      installer_matrix: ${{ steps.targets.outputs.matrix }}
    # Every job takes its runner from a repo variable: AVE_LINUX_RUNNER,
    # AVE_MACOS_RUNNER, AVE_WINDOWS_RUNNER (a JSON label array, e.g.
    # ["self-hosted","Linux","ARM64","ave"], or a hosted label such as
    # "ubuntu-24.04-arm" to opt into a GitHub-hosted runner explicitly). Every
    # other job needs this one, so the check below fails the run naming any
    # unset variable instead of falling back to a billing-blocked hosted label.
    # Only this job falls back when AVE_LINUX_RUNNER is unset, and to any
    # self-hosted runner, so the check can still run and say so. Before the
    # repo goes public, set every AVE_*_RUNNER to its hosted label.
    runs-on: ${{ vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the release runner variables
        shell: bash
        env:
          AVE_LINUX_RUNNER: ${{ vars.AVE_LINUX_RUNNER }}
          AVE_MACOS_RUNNER: ${{ vars.AVE_MACOS_RUNNER }}
          AVE_WINDOWS_RUNNER: ${{ vars.AVE_WINDOWS_RUNNER }}
        run: bash .github/scripts/require-runner-vars.sh AVE_LINUX_RUNNER AVE_MACOS_RUNNER AVE_WINDOWS_RUNNER
      - name: Select installer targets
        id: targets
        shell: bash
        env:
          INSTALLER_SCOPE: ${{ inputs.installer_scope || 'all' }}
          AVE_MACOS_RUNNER: ${{ vars.AVE_MACOS_RUNNER }}
          AVE_LINUX_RUNNER: ${{ vars.AVE_LINUX_RUNNER }}
          AVE_WINDOWS_RUNNER: ${{ vars.AVE_WINDOWS_RUNNER }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee -a "$GITHUB_OUTPUT"
          const scope = process.env.INSTALLER_SCOPE;
          if (scope !== "all" && scope !== "windows-disposable") {
            throw new Error("Unsupported installer scope");
          }
          const include = scope === "windows-disposable"
            ? [{ name: "Windows disposable installer", os: "windows-2025", target: "win" }]
            : [
              { name: "macOS installer", os: JSON.parse(process.env.AVE_MACOS_RUNNER), target: "mac" },
              { name: "Linux installer", os: JSON.parse(process.env.AVE_LINUX_RUNNER), target: "linux" },
              { name: "Windows installer", os: JSON.parse(process.env.AVE_WINDOWS_RUNNER), target: "win" },
            ];
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected source SHA must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      # Fails a tag build in a repository package.json `repository` does not
      # name before the installer matrix spends time on it. publish-release
      # and publish-r2 repeat the check before they attach or upload anything.
      - name: Verify package.json repository is this repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Require an immutable protected public tag
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi
      - name: Verify immutable unsigned release profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-profile.mjs \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}"

  installers:
    name: ${{ matrix.name }}
    needs: release-profile
    if: github.event_name == 'push' || inputs.installer_scope == 'windows-disposable' || inputs.contract_probe != 'true'
    # Matrix builds only produce workflow artifacts. The atomic publisher owns
    # the sole contents:write permission in its separate job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # macOS and Windows take their runner from repo variables AVE_MACOS_RUNNER
      # and AVE_WINDOWS_RUNNER (JSON label arrays, e.g.
      # ["self-hosted","macOS","ARM64","ave-release"] and
      # ["self-hosted","Windows","X64","ave-release"], or a hosted label).
      # release-profile has already failed the run if either is unset.
      #
      # Linux takes AVE_LINUX_RUNNER (the ARM64 self-hosted runners) like the
      # other release Linux jobs, and always ships x64: `--arch x64` pins the
      # target, so on an ARM64 host build-installers cross-builds (target-arch
      # node_modules, node-pty compiled with x86_64-linux-gnu-gcc) and the arch
      # audit below refuses any non-x64 binary. On an x64 runner the same
      # command is a native build.
      matrix: ${{ fromJSON(needs.release-profile.outputs.installer_matrix) }}
    runs-on: ${{ matrix.os }}
    # One shell on every OS. On Windows `bash` is the Git for Windows shell,
    # which a self-hosted Windows runner must have on PATH (checkout needs Git
    # too); an unset shell there would depend on which PowerShell is installed.
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # Bun's package cache defaults to .bun/install/cache in the runner user's
      # home, which on a self-hosted runner is the owner's own cache. Keep it
      # in the workspace.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      # `clean: true` (git clean -ffdx + reset) wipes the previous run's
      # release/, .cache/ and node_modules/ on a persistent self-hosted runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      # Self-hosted machines have no preinstalled toolcache; install Node into
      # the runner's own tool cache instead of relying on a system Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      # The pinned bun from .bun-version goes under RUNNER_TEMP, never into
      # the owner's own bun home on a self-hosted runner; on Windows it is a
      # checksum-verified release download (see the action).
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version
      - name: Restore package manager and installer caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bun
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-installers-${{ hashFiles('bun.lock') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-installers-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-installers-
      # Cache fetched uv runtime (downloaded by scripts/fetch-uv.mjs during postinstall).
      # Key is pinned to uv-targets.mjs so version bumps invalidate the cache. Saves
      # ~30s per matrix job on cold runners and avoids re-downloading from GitHub releases.
      - name: Restore uv runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('scripts/uv-targets.mjs', 'scripts/fetch-uv.mjs') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      # electron-builder >= 26.14 extracts its icon-conversion helper
      # (icons@x.y.z/icon-tool.js — CommonJS, uses `require`) under
      # ELECTRON_BUILDER_CACHE, which this workflow places INSIDE the
      # workspace (.cache/). Node resolves that file's module scope by
      # walking up to the nearest package.json — the repo root, whose
      # "type": "module" makes the CJS tool execute as ESM and die with
      # "ReferenceError: require is not defined in ES module scope"
      # (v0.3.0 mac/win installer failure; linux passed because AppImage
      # consumes the png directly). Scoping the ELECTRON_BUILDER_CACHE
      # directory itself as CommonJS stops the walk at that boundary for
      # every tool electron-builder extracts there, without touching the
      # sibling ELECTRON_CACHE (.cache/electron) or anything else under
      # .cache/. Local builds are unaffected — the default cache lives in
      # the OS cache dir, outside any workspace package.json scope.
      - name: Scope electron-builder cache dir as CommonJS
        shell: bash
        run: |
          mkdir -p "$ELECTRON_BUILDER_CACHE"
          printf '{ "type": "commonjs" }\n' > "$ELECTRON_BUILDER_CACHE/package.json"
      # Packaging needs fakeroot/rpmbuild; the arch audit needs file, dpkg-deb,
      # rpm2cpio, cpio and unsquashfs (AppImage payload); node-gyp needs
      # python3 and make; an ARM64 host also needs the x86_64-linux-gnu cross
      # compiler for node-pty, and an x64 host the launch gates' X/D-Bus/keyring.
      # A self-hosted runner has no sudo and is provisioned with these (add
      # them to the runner provisioning, never install from here); a hosted
      # runner installs exactly the named packages it lacks: no upgrade, no
      # recommends, no meta-package.
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          tools=(fakeroot:fakeroot rpmbuild:rpm file:file dpkg-deb:dpkg rpm2cpio:rpm2cpio cpio:cpio unsquashfs:squashfs-tools python3:python3 make:make)
          case "$(uname -m)" in
            aarch64) tools+=(x86_64-linux-gnu-gcc:gcc-x86-64-linux-gnu x86_64-linux-gnu-g++:g++-x86-64-linux-gnu x86_64-linux-gnu-ar:binutils-x86-64-linux-gnu) ;;
            x86_64) tools+=(xvfb-run:xvfb dbus-run-session:dbus dbus-launch:dbus-x11 gnome-keyring-daemon:gnome-keyring) ;;
            *) echo "unsupported Linux installer host: $(uname -m)" >&2; exit 1 ;;
          esac
          missing=()
          for entry in "${tools[@]}"; do
            command -v "${entry%%:*}" >/dev/null 2>&1 || missing+=("${entry#*:}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${{ runner.environment }}" != "github-hosted" ]; then
              echo "::error::self-hosted Linux runner lacks packages: ${missing[*]} (provision them; the runner user has no sudo)"
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --no-upgrade "${missing[@]}"
          fi
          if [ "$(uname -m)" = aarch64 ]; then
            test "$(x86_64-linux-gnu-gcc -dumpmachine)" = x86_64-linux-gnu
          fi
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' "${tools[@]#*:}" 2>/dev/null | sort -u || true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build installer
        id: build
        shell: bash
        run: |
          set -euo pipefail
          args=("--${{ matrix.target }}")
          if [ "${{ inputs.installer_scope }}" = "windows-disposable" ]; then
            args+=("--skip-code-sign" "--publish" "never")
            echo "skip_sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Public tags are currently unsigned by deliberate policy. This is
            # event-fixed, not inferred from secrets or tagged source output.
            args+=("--skip-code-sign")
            echo "skip_sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.skip_code_sign }}" = "true" ] \
            || [ "${{ runner.environment }}" != "github-hosted" ] \
            || { [ "${{ matrix.target }}" = "mac" ] && [ -z "${CSC_LINK:-}" ]; } \
            || { [ "${{ matrix.target }}" = "win" ] && [ -z "${WIN_CSC_LINK:-}" ]; }; then
            # Manual candidates are secret-free; default to unsigned unless a
            # future protected workflow deliberately adds signing evidence.
            # A self-hosted runner is the owner's own machine: signing there
            # would import into and search its keychain, and a signing
            # variable in that machine's environment is not workflow evidence,
            # so it always builds unsigned.
            args+=("--skip-code-sign")
            echo "skip_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sign=false" >> "$GITHUB_OUTPUT"
          fi
          args+=("--skip-native-rebuild")
          if [ "${{ matrix.target }}" = "linux" ]; then
            # Linux installers ship x64 whatever the runner's arch.
            args+=("--arch" "x64")
          fi
          # Matrix jobs only upload workflow artifacts. Disposable validation
          # explicitly uses publish=never; other builds use that script default.
          # The separate publisher assembles all platforms for tag releases.
          node scripts/build-installers.mjs "${args[@]}"
      # Hard gate: every ELF and every .node in linux-unpacked, the AppImage
      # runtime, and the extracted deb and rpm payloads (plus their declared
      # arch) must be x86-64 by both the ELF header and file(1).
      - name: Verify Linux installers are x64
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-linux-package-arch.mjs --release-dir release --arch x64 --require-installers
      # The launch gates execute the packaged app, which an ARM64 host cannot
      # run as x64 without registering qemu in the host kernel's binfmt_misc —
      # a host-wide change to a machine other containers share. A cross-built
      # Linux package is therefore not launched here; the arch audit above is
      # its gate.
      - name: Decide packaged launch gates
        id: launch
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ] && [ "$(uname -m)" != "x86_64" ]; then
            echo "::warning::Linux x64 installer cross-built on $(uname -m): packaged smoke and escape gate cannot launch it here"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke launch packaged app
        # macOS Gatekeeper blocks launch of unsigned .app bundles. Public tags
        # and secret-free manual candidates therefore skip only this macOS
        # launch gate so their artifacts can upload; Linux/Windows still run
        # smoke. `steps.build.outputs.skip_sign` is the signing SOT.
        #
        # A self-hosted Windows runner is the owner's own PC, so it never
        # launches the packaged app: the full application claims HKCU ave://
        # for its executable (setAsDefaultProtocolClient), replacing the
        # owner's registration, and a cancelled job would leave it pointing at
        # a deleted release/. The NSIS setup smoke also installs machine-wide
        # and genuinely uninstalls. Both therefore run only on a disposable
        # hosted Windows runner; a self-hosted Windows build ships without a
        # launch smoke, as an unsigned macOS build does.
        if: >-
          steps.launch.outputs.run == 'true'
          && (matrix.target != 'mac' || steps.build.outputs.skip_sign != 'true')
          && (matrix.target != 'win' || runner.environment == 'github-hosted')
        shell: bash
        env:
          # Explicitly authorize machine-wide mutation only on the disposable
          # Windows runner, then verify both preservation and full cleanup.
          AVE_ALLOW_DISPOSABLE_WINDOWS_INSTALLER_SMOKE: ${{ matrix.target == 'win' && runner.environment == 'github-hosted' && '1' || '' }}
          # Hosted Windows runners are disposable, so the installer smoke can
          # verify both /KEEP_APP_DATA preservation and the full uninstall cleanup.
          AVE_ALLOW_DESTRUCTIVE_UNINSTALL_SMOKE: ${{ matrix.target == 'win' && runner.environment == 'github-hosted' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "linux" ]; then
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf %s packaged-smoke | gnome-keyring-daemon --unlock --components=secrets)"
              xvfb-run -a node scripts/smoke-packaged-app.mjs --target linux
            '
          else
            node scripts/smoke-packaged-app.mjs --target "${{ matrix.target }}"
          fi
      # Admission's packaged gate for escape 3 (plugin-hostapi-protocol.md §9.8
      # A2, Gates (ii)): the plugin child's Electron view measured under the
      # packaged runtime, beside the packaged application's own main process as
      # the control. Same launch condition and Linux session as the smoke above:
      # the control is a full application, so it never runs on the owner's
      # self-hosted Windows PC either.
      - name: Packaged escape gate
        if: >-
          steps.launch.outputs.run == 'true'
          && (matrix.target != 'mac' || steps.build.outputs.skip_sign != 'true')
          && (matrix.target != 'win' || runner.environment == 'github-hosted')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "linux" ]; then
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf %s packaged-escape-gate | gnome-keyring-daemon --unlock --components=secrets)"
              xvfb-run -a node scripts/packaged-escape-gate.mjs --target linux
            '
          else
            node scripts/packaged-escape-gate.mjs --target "${{ matrix.target }}"
          fi
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ave-${{ matrix.target }}-installers
          # Include `.blockmap` (electron-updater differential update sidecar)
          # so the `publish-release` job can attach it to the GitHub Release
          # alongside the installer itself. Without the blockmap, auto-update
          # falls back to full downloads. Internal subdirs like `mac-arm64/`
          # or `win-unpacked/` (electron-builder's intermediate output) are
          # not uploaded — only the top-level installer artifacts.
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.exe.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
      # A persistent runner keeps its workspace between runs; drop the
      # installers now rather than holding them until the next checkout cleans.
      # .cache/ stays until then because the cache action saves it after this.
      - name: Remove build output from a self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf release

  # ─────────────────────────────────────────────────────────────────────
  # publish-release — atomic single-job publisher.
  #
  # The matrix `installers` jobs above used to call `electron-builder
  # --publish always` directly, which produced partial Release pages
  # whenever 3 simultaneous uploads hit the GitHub API contention window
  # (v0.2.1 + v0.2.2 release cycles both lost ~5 assets each). This job
  # consolidates the upload step into a single runner: download every
  # platform artifact, then attach them all to the tag's GitHub Release
  # in one go via `softprops/action-gh-release`. No race possible.
  #
  # Triggered only on tag push (the same condition the old inline
  # publisher used). `workflow_dispatch` builds still produce workflow
  # artifacts but skip the Release upload, matching prior behavior.
  publish-release:
    name: Publish GitHub Release assets (atomic)
    needs: [release-profile, installers]
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.AVE_LINUX_RUNNER) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      # The GitHub Release is the secondary record of a tag. Drafting it in
      # any repository package.json `repository` does not name (a fork, an old
      # owner) would record the release somewhere it does not belong.
      - name: Verify package.json repository is this repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Verify protected annotated tag still resolves to event SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi

          tag_ref="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_object_type="$(jq --raw-output '.object.type // empty' <<<"$tag_ref")"
          tag_object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_ref")"
          if [ "$tag_object_type" != "tag" ] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public release tag must remain an annotated tag" >&2
            exit 1
          fi

          tag_object="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          target_type="$(jq --raw-output '.object.type // empty' <<<"$tag_object")"
          target_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
          if [ "$target_type" != "commit" ] || [ "$target_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Annotated tag does not resolve to the immutable event source SHA" >&2
            exit 1
          fi
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-staging
          pattern: ave-*-installers
          merge-multiple: true
      - name: List downloaded assets
        run: ls -la release-staging/
      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # `tag_name` defaults to the pushed tag (github.ref_name) since
          # this job runs only on tag push events.
          files: release-staging/*
          # Keep the release draft until a human (or the release script)
          # publishes it — matches the prior electron-builder default.
          draft: true
          # Current public tag policy is only unsigned, so the disclosure is a
          # reviewed static template rather than tagged source output.
          body_path: .github/release-bodies/public-unsigned.md
          target_commitish: ${{ github.sha }}
          # Replace the initial GitHub draft body with the profile template.
          # Curated notes added before publishing must retain its disclosure.
          append_body: false
          generate_release_notes: false
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # publish-r2 — the primary download and auto-update channel.
  #
  # Installed apps read the `generic` feed in package.json build.publish
  # (https://downloads.agent-connector.ai/releases/latest*.yml), served from
  # a Cloudflare R2 bucket through its custom domain. This job uploads the
  # same matrix artifacts publish-release attaches; scripts/upload-release-r2.mjs
  # owns the object layout and order: versioned installers and blockmaps
  # first, then the `latest/` download aliases, then the feed files last, so
  # a client never reads a feed that names a file not yet uploaded.
  #
  # It does not depend on publish-release: the GitHub Release is a draft
  # record and must not hold back the update channel. Same tag-only gating.
  publish-r2:
    name: Publish to the R2 release channel
    needs: [release-profile, installers]
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.AVE_LINUX_RUNNER) }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      - name: Verify package.json repository is this repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Verify protected annotated tag still resolves to event SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi

          tag_ref="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_object_type="$(jq --raw-output '.object.type // empty' <<<"$tag_ref")"
          tag_object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_ref")"
          if [ "$tag_object_type" != "tag" ] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public release tag must remain an annotated tag" >&2
            exit 1
          fi

          tag_object="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          target_type="$(jq --raw-output '.object.type // empty' <<<"$tag_object")"
          target_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
          if [ "$target_type" != "commit" ] || [ "$target_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Annotated tag does not resolve to the immutable event source SHA" >&2
            exit 1
          fi
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-staging
          pattern: ave-*-installers
          merge-multiple: true
      - name: Plan the R2 upload
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/upload-release-r2.mjs --dir release-staging --tag "$RELEASE_TAG" --dry-run
      # Self-hosted runners carry no AWS CLI. The script installs the official
      # build after checking its signature, with no secret in scope.
      - name: Provide the AWS CLI
        shell: bash
        run: bash .github/scripts/install-aws-cli.sh
      - name: Upload to R2
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws --version
          node scripts/upload-release-r2.mjs --dir release-staging --tag "$RELEASE_TAG"

  # ─────────────────────────────────────────────────────────────────────
  # publish-contract — the contract bundle under contract/<tag>/.
  #
  # The public marketplace verifies plugins only against what this job
  # publishes, never against an Ave checkout: the plugin contract source, the
  # manifest and host-protocol schemas, and the checker and agent-plugin
  # component extractor bundled with Bun (scripts/build-contract-bundle.mjs),
  # with bundle.json and SHA256SUMS. SHA256SUMS is signed keyless through
  # GitHub OIDC; the certificate names this workflow at the tag ref, and the
  # marketplace refuses any other identity. Objects under a tag are
  # write-once (scripts/upload-contract-bundle-r2.mjs).
  #
  # A tag push publishes to contract/<tag>/. A workflow_dispatch from main
  # with contract_probe=true runs the steps under _ci-probe/contract/<run>/,
  # proves a rerun keeps the published signature, and deletes the probe; its
  # certificate names main instead of a tag. It needs only
  # release-profile, so the installer matrix never holds it back.
  publish-contract:
    name: Publish the signed contract bundle
    needs: release-profile
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.contract_probe == 'true' && inputs.installer_scope != 'windows-disposable')
    runs-on: ${{ fromJSON(vars.AVE_LINUX_RUNNER) }}
    environment: release
    # id-token: write is the keyless signing identity; no other job has it.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify exact source head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      - name: Verify package.json repository is this repository
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Verify protected annotated tag still resolves to event SHA
        if: github.event_name == 'push'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi

          tag_ref="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_object_type="$(jq --raw-output '.object.type // empty' <<<"$tag_ref")"
          tag_object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_ref")"
          if [ "$tag_object_type" != "tag" ] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public release tag must remain an annotated tag" >&2
            exit 1
          fi

          tag_object="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          target_type="$(jq --raw-output '.object.type // empty' <<<"$tag_object")"
          target_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
          if [ "$target_type" != "commit" ] || [ "$target_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Annotated tag does not resolve to the immutable event source SHA" >&2
            exit 1
          fi
      # The bundled checker's bytes depend on the Bun version, so this job uses
      # the .bun-version build like the installers, through the shared setup-bun
      # action (which installs it under a home in RUNNER_TEMP).
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version
      # bun, cosign (its Sigstore trust cache) and the AWS CLI resolve the home
      # directory; on a self-hosted runner that is the owner's own.
      - name: Isolate home and temp directories in the runner temp
        run: node .github/scripts/isolate-job-home.mjs
      - name: Verify bun is the job-local pinned build
        env:
          BUN_HOME: ${{ runner.temp }}/bun-home
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .bun-version)"
          actual="$(bun --version)"
          if [ "$actual" != "$expected" ]; then
            echo "bun $actual on PATH, expected $expected from .bun-version" >&2
            exit 1
          fi
          case "$(command -v bun)" in
            "$BUN_HOME"/*) ;;
            *)
              echo "bun on PATH is $(command -v bun), not the job-local install under $BUN_HOME" >&2
              exit 1
              ;;
          esac
      # Bundling reads the sources and node_modules only; install scripts
      # (native rebuilds, the uv runtime, protocol and hook registration) are
      # not part of the bundle and must not touch a self-hosted runner.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Choose the bundle target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # GITHUB_WORKFLOW_REF is owner/repo/.github/workflows/<file>@<ref>,
          # the certificate SAN Fulcio issues for this job.
          # The release environment changes OIDC sub, not this workflow ref.
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          if [ "$EVENT_NAME" = "push" ]; then
            expected="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-installers.yml@refs/tags/${GITHUB_REF_NAME}"
            if [ "$GITHUB_REF" != "refs/tags/${GITHUB_REF_NAME}" ] || [ "$identity" != "$expected" ]; then
              echo "Signing identity $identity is not $expected" >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            prefix="contract/${tag}/"
          else
            tag="ci-probe-${RUN_KEY}"
            prefix="_ci-probe/contract/${RUN_KEY}/"
          fi
          {
            echo "identity=$identity"
            echo "tag=$tag"
            echo "prefix=$prefix"
            echo "dir=$RUNNER_TEMP/contract-bundle"
          } >> "$GITHUB_OUTPUT"
          echo "contract bundle $tag -> $prefix signed as $identity"
      - name: Build the contract bundle
        env:
          BUNDLE_DIR: ${{ steps.target.outputs.dir }}
          BUNDLE_TAG: ${{ steps.target.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/build-contract-bundle.mjs --out "$BUNDLE_DIR" --tag "$BUNDLE_TAG" --commit "$EXPECTED_SOURCE_SHA"
          (cd "$BUNDLE_DIR" && sha256sum --check --strict SHA256SUMS)
      - name: Provide cosign
        run: bash .github/scripts/install-cosign.sh
      - name: Sign SHA256SUMS keyless
        env:
          BUNDLE_DIR: ${{ steps.target.outputs.dir }}
          IDENTITY: ${{ steps.target.outputs.identity }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "$BUNDLE_DIR/SHA256SUMS.sigstore.json" "$BUNDLE_DIR/SHA256SUMS"
          cosign verify-blob --bundle "$BUNDLE_DIR/SHA256SUMS.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$BUNDLE_DIR/SHA256SUMS"
      # Self-hosted runners carry no AWS CLI. The script installs the official
      # build after checking its signature, with no secret in scope.
      - name: Provide the AWS CLI
        run: bash .github/scripts/install-aws-cli.sh
      - name: Upload the contract bundle to R2
        env:
          BUNDLE_DIR: ${{ steps.target.outputs.dir }}
          PREFIX: ${{ steps.target.outputs.prefix }}
          IDENTITY: ${{ steps.target.outputs.identity }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws --version
          node scripts/upload-contract-bundle-r2.mjs --dir "$BUNDLE_DIR" --prefix "$PREFIX" --identity "$IDENTITY"
      # A rerun of a tag signs again, so its signature bytes differ from the
      # published ones. The probe proves that path: a fresh signature over the
      # same SHA256SUMS must leave every object in place.
      - name: Probe a rerun against the published bundle
        if: github.event_name != 'push'
        env:
          BUNDLE_DIR: ${{ steps.target.outputs.dir }}
          PREFIX: ${{ steps.target.outputs.prefix }}
          IDENTITY: ${{ steps.target.outputs.identity }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          rerun="$RUNNER_TEMP/contract-bundle-rerun"
          rm -rf "$rerun"
          cp -R "$BUNDLE_DIR" "$rerun"
          rm "$rerun/SHA256SUMS.sigstore.json"
          cosign sign-blob --yes --bundle "$rerun/SHA256SUMS.sigstore.json" "$rerun/SHA256SUMS"
          if cmp -s "$rerun/SHA256SUMS.sigstore.json" "$BUNDLE_DIR/SHA256SUMS.sigstore.json"; then
            echo "A second signature has the same bytes; the rerun path is not exercised" >&2
            exit 1
          fi
          node scripts/upload-contract-bundle-r2.mjs --dir "$rerun" --prefix "$PREFIX" --identity "$IDENTITY" | tee "$RUNNER_TEMP/rerun.log"
          grep -q 'keep .*SHA256SUMS.sigstore.json (the published signature verifies' "$RUNNER_TEMP/rerun.log"
      - name: Delete the probe bundle
        if: always() && github.event_name != 'push' && steps.target.outputs.prefix != ''
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            echo "No AWS CLI; nothing was uploaded under $PREFIX"
            exit 0
          fi
          node scripts/upload-contract-bundle-r2.mjs --delete --prefix "$PREFIX"
