name: Build Installers

on:
  workflow_dispatch:
    inputs:
      skip_code_sign:
        description: Build unsigned internal installers
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*.*.*"

jobs:
  # Public tag semantics are verified from the immutable event SHA. The profile
  # never controls secret injection; public tag secrets are fixed in workflow.
  release-profile:
    name: Verify immutable unsigned release profile
    # Linux jobs here take the runner from repo variable AVE_LINUX_RUNNER
    # (JSON label array, e.g. ["self-hosted","Linux","ARM64","ave"]); unset =
    # hosted fallback, as in ci.yml. Private repo only: unset every AVE_*_RUNNER
    # variable before the repo goes public.
    runs-on: ${{ vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected source SHA must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      # Fails a tag build in a repository package.json `repository` does not
      # name before the installer matrix spends time on it. publish-release
      # and publish-r2 repeat the check before they attach or upload anything.
      - name: Verify package.json repository is this repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Require an immutable protected public tag
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi
      - name: Verify immutable unsigned release profile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-profile.mjs \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}"

  installers:
    name: ${{ matrix.name }}
    needs: release-profile
    # Matrix builds only produce workflow artifacts. The atomic publisher owns
    # the sole contents:write permission in its separate job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # macOS and Windows take their runner from repo variables AVE_MACOS_RUNNER
      # and AVE_WINDOWS_RUNNER (JSON label arrays, e.g.
      # ["self-hosted","macOS","ARM64","ave-release"] and
      # ["self-hosted","Windows","X64","ave-release"]); unset = hosted label.
      # Private repo only: unset them before the repo goes public.
      #
      # Linux stays on the hosted x64 label: no target arch is pinned, so the
      # build host's architecture is the shipped architecture, and the
      # self-hosted Linux runners are ARM64.
      matrix:
        include:
          - name: macOS installer
            os: ${{ vars.AVE_MACOS_RUNNER && fromJSON(vars.AVE_MACOS_RUNNER) || 'macos-15' }}
            target: mac
          - name: Linux installer
            os: ubuntu-latest
            target: linux
          - name: Windows installer
            os: ${{ vars.AVE_WINDOWS_RUNNER && fromJSON(vars.AVE_WINDOWS_RUNNER) || 'windows-latest' }}
            target: win
    runs-on: ${{ matrix.os }}
    # One shell on every OS. On Windows `bash` is the Git for Windows shell,
    # which a self-hosted Windows runner must have on PATH (checkout needs Git
    # too); an unset shell there would depend on which PowerShell is installed.
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      # `clean: true` (git clean -ffdx + reset) wipes the previous run's
      # release/, .cache/ and node_modules/ on a persistent self-hosted runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      # Self-hosted machines have no preinstalled toolcache; install Node into
      # the runner's own tool cache instead of relying on a system Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Restore package manager and installer caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-installers-${{ hashFiles('bun.lock') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-installers-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-installers-
      # Cache fetched uv runtime (downloaded by scripts/fetch-uv.mjs during postinstall).
      # Key is pinned to uv-targets.mjs so version bumps invalidate the cache. Saves
      # ~30s per matrix job on cold runners and avoids re-downloading from GitHub releases.
      - name: Restore uv runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('scripts/uv-targets.mjs', 'scripts/fetch-uv.mjs') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      # electron-builder >= 26.14 extracts its icon-conversion helper
      # (icons@x.y.z/icon-tool.js — CommonJS, uses `require`) under
      # ELECTRON_BUILDER_CACHE, which this workflow places INSIDE the
      # workspace (.cache/). Node resolves that file's module scope by
      # walking up to the nearest package.json — the repo root, whose
      # "type": "module" makes the CJS tool execute as ESM and die with
      # "ReferenceError: require is not defined in ES module scope"
      # (v0.3.0 mac/win installer failure; linux passed because AppImage
      # consumes the png directly). Scoping the ELECTRON_BUILDER_CACHE
      # directory itself as CommonJS stops the walk at that boundary for
      # every tool electron-builder extracts there, without touching the
      # sibling ELECTRON_CACHE (.cache/electron) or anything else under
      # .cache/. Local builds are unaffected — the default cache lives in
      # the OS cache dir, outside any workspace package.json scope.
      - name: Scope electron-builder cache dir as CommonJS
        shell: bash
        run: |
          mkdir -p "$ELECTRON_BUILDER_CACHE"
          printf '{ "type": "commonjs" }\n' > "$ELECTRON_BUILDER_CACHE/package.json"
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb dbus dbus-x11 gnome-keyring
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build installer
        id: build
        shell: bash
        run: |
          set -euo pipefail
          args=("--${{ matrix.target }}")
          if [ "${{ github.event_name }}" = "push" ]; then
            # Public tags are currently unsigned by deliberate policy. This is
            # event-fixed, not inferred from secrets or tagged source output.
            args+=("--skip-code-sign")
            echo "skip_sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.skip_code_sign }}" = "true" ] \
            || { [ "${{ matrix.target }}" = "mac" ] && [ -z "${CSC_LINK:-}" ]; } \
            || { [ "${{ matrix.target }}" = "win" ] && [ -z "${WIN_CSC_LINK:-}" ]; }; then
            # Manual candidates are secret-free; default to unsigned unless a
            # future protected workflow deliberately adds signing evidence.
            args+=("--skip-code-sign")
            echo "skip_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sign=false" >> "$GITHUB_OUTPUT"
          fi
          args+=("--skip-native-rebuild")
          # NO `--publish` here. The matrix runs three jobs in parallel and
          # if each told electron-builder to publish directly to the same
          # GitHub Release draft, the GitHub API contention produced partial
          # uploads (some assets land, others don't) — observed in v0.2.1 +
          # v0.2.2 release cycles. Instead each job uploads its build output
          # as a workflow artifact, and a single `publish-release` job (below,
          # `needs: installers`) assembles every platform's artifacts and
          # uploads them atomically.
          node scripts/build-installers.mjs "${args[@]}"
      - name: Smoke launch packaged app
        # macOS Gatekeeper blocks launch of unsigned .app bundles. Public tags
        # and secret-free manual candidates therefore skip only this macOS
        # launch gate so their artifacts can upload; Linux/Windows still run
        # smoke. `steps.build.outputs.skip_sign` is the signing SOT.
        #
        # The Windows smoke installs machine-wide and genuinely uninstalls, so
        # it runs only on a disposable hosted runner. A self-hosted Windows
        # machine is a persistent host: the step is skipped there and the
        # installer ships without that smoke.
        if: >-
          (matrix.target != 'mac' || steps.build.outputs.skip_sign != 'true')
          && (matrix.target != 'win' || runner.environment == 'github-hosted')
        shell: bash
        env:
          # Explicitly authorize machine-wide mutation only on the disposable
          # Windows runner, then verify both preservation and full cleanup.
          AVE_ALLOW_DISPOSABLE_WINDOWS_INSTALLER_SMOKE: ${{ matrix.target == 'win' && runner.environment == 'github-hosted' && '1' || '' }}
          # Hosted Windows runners are disposable, so the installer smoke can
          # verify both /KEEP_APP_DATA preservation and the full uninstall cleanup.
          AVE_ALLOW_DESTRUCTIVE_UNINSTALL_SMOKE: ${{ matrix.target == 'win' && runner.environment == 'github-hosted' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "linux" ]; then
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf %s packaged-smoke | gnome-keyring-daemon --unlock --components=secrets)"
              xvfb-run -a node scripts/smoke-packaged-app.mjs --target linux
            '
          else
            node scripts/smoke-packaged-app.mjs --target "${{ matrix.target }}"
          fi
      # Admission's packaged gate for escape 3 (plugin-hostapi-protocol.md §9.8
      # A2, Gates (ii)): the plugin child's Electron view measured under the
      # packaged runtime, beside the packaged application's own main process as
      # the control. Same launch condition and Linux session as the smoke above:
      # the control is a full application.
      - name: Packaged escape gate
        if: matrix.target != 'mac' || steps.build.outputs.skip_sign != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "linux" ]; then
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf %s packaged-escape-gate | gnome-keyring-daemon --unlock --components=secrets)"
              xvfb-run -a node scripts/packaged-escape-gate.mjs --target linux
            '
          else
            node scripts/packaged-escape-gate.mjs --target "${{ matrix.target }}"
          fi
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ave-${{ matrix.target }}-installers
          # Include `.blockmap` (electron-updater differential update sidecar)
          # so the `publish-release` job can attach it to the GitHub Release
          # alongside the installer itself. Without the blockmap, auto-update
          # falls back to full downloads. Internal subdirs like `mac-arm64/`
          # or `win-unpacked/` (electron-builder's intermediate output) are
          # not uploaded — only the top-level installer artifacts.
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.exe.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
      # A persistent runner keeps its workspace between runs; drop the
      # installers now rather than holding them until the next checkout cleans.
      # .cache/ stays until then because the cache action saves it after this.
      - name: Remove build output from a self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf release

  # ─────────────────────────────────────────────────────────────────────
  # publish-release — atomic single-job publisher.
  #
  # The matrix `installers` jobs above used to call `electron-builder
  # --publish always` directly, which produced partial Release pages
  # whenever 3 simultaneous uploads hit the GitHub API contention window
  # (v0.2.1 + v0.2.2 release cycles both lost ~5 assets each). This job
  # consolidates the upload step into a single runner: download every
  # platform artifact, then attach them all to the tag's GitHub Release
  # in one go via `softprops/action-gh-release`. No race possible.
  #
  # Triggered only on tag push (the same condition the old inline
  # publisher used). `workflow_dispatch` builds still produce workflow
  # artifacts but skip the Release upload, matching prior behavior.
  publish-release:
    name: Publish GitHub Release assets (atomic)
    needs: [release-profile, installers]
    if: github.event_name == 'push'
    runs-on: ${{ vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'ubuntu-24.04-arm' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      # The GitHub Release is the secondary record of a tag. Drafting it in
      # any repository package.json `repository` does not name (a fork, an old
      # owner) would record the release somewhere it does not belong.
      - name: Verify package.json repository is this repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Verify protected annotated tag still resolves to event SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi

          tag_ref="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_object_type="$(jq --raw-output '.object.type // empty' <<<"$tag_ref")"
          tag_object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_ref")"
          if [ "$tag_object_type" != "tag" ] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public release tag must remain an annotated tag" >&2
            exit 1
          fi

          tag_object="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          target_type="$(jq --raw-output '.object.type // empty' <<<"$tag_object")"
          target_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
          if [ "$target_type" != "commit" ] || [ "$target_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Annotated tag does not resolve to the immutable event source SHA" >&2
            exit 1
          fi
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-staging
          pattern: ave-*-installers
          merge-multiple: true
      - name: List downloaded assets
        run: ls -la release-staging/
      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # `tag_name` defaults to the pushed tag (github.ref_name) since
          # this job runs only on tag push events.
          files: release-staging/*
          # Keep the release draft until a human (or the release script)
          # publishes it — matches the prior electron-builder default.
          draft: true
          # Current public tag policy is only unsigned, so the disclosure is a
          # reviewed static template rather than tagged source output.
          body_path: .github/release-bodies/public-unsigned.md
          target_commitish: ${{ github.sha }}
          # Replace the initial GitHub draft body with the profile template.
          # Curated notes added before publishing must retain its disclosure.
          append_body: false
          generate_release_notes: false
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # publish-r2 — the primary download and auto-update channel.
  #
  # Installed apps read the `generic` feed in package.json build.publish
  # (https://downloads.agent-connector.ai/releases/latest*.yml), served from
  # a Cloudflare R2 bucket through its custom domain. This job uploads the
  # same matrix artifacts publish-release attaches; scripts/upload-release-r2.mjs
  # owns the object layout and order: versioned installers and blockmaps
  # first, then the `latest/` download aliases, then the feed files last, so
  # a client never reads a feed that names a file not yet uploaded.
  #
  # It does not depend on publish-release: the GitHub Release is a draft
  # record and must not hold back the update channel. Same tag-only gating.
  publish-r2:
    name: Publish to the R2 release channel
    needs: [release-profile, installers]
    if: github.event_name == 'push'
    runs-on: ${{ vars.AVE_LINUX_RUNNER && fromJSON(vars.AVE_LINUX_RUNNER) || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout HEAD does not equal immutable event source SHA" >&2
            exit 1
          fi
      - name: Verify package.json repository is this repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-repository.mjs
      - name: Verify protected annotated tag still resolves to event SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Public tag releases require an active immutable v* tag ruleset" >&2
            exit 1
          fi

          tag_ref="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_object_type="$(jq --raw-output '.object.type // empty' <<<"$tag_ref")"
          tag_object_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_ref")"
          if [ "$tag_object_type" != "tag" ] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public release tag must remain an annotated tag" >&2
            exit 1
          fi

          tag_object="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          target_type="$(jq --raw-output '.object.type // empty' <<<"$tag_object")"
          target_sha="$(jq --raw-output '.object.sha // empty' <<<"$tag_object")"
          if [ "$target_type" != "commit" ] || [ "$target_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Annotated tag does not resolve to the immutable event source SHA" >&2
            exit 1
          fi
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-staging
          pattern: ave-*-installers
          merge-multiple: true
      - name: Plan the R2 upload
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/upload-release-r2.mjs --dir release-staging --tag "$RELEASE_TAG" --dry-run
      # Self-hosted runners carry no AWS CLI. The script installs the official
      # build after checking its signature, with no secret in scope.
      - name: Provide the AWS CLI
        shell: bash
        run: bash .github/scripts/install-aws-cli.sh
      - name: Upload to R2
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws --version
          node scripts/upload-release-r2.mjs --dir release-staging --tag "$RELEASE_TAG"
