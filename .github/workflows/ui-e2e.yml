name: UI E2E (Playwright + Electron)

# Opt-in only. Run manually via workflow_dispatch or when PR branches
# explicitly include a `ui-e2e` label. Keeps normal CI fast.
on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

jobs:
  ui-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ui-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E: "1"
      AVE_E2E: "1"
    steps:
      - name: Checkout ave
        uses: actions/checkout@v4
        with:
          path: ave

      # Sibling plugin repos are required because ave declares
      # file:../ave-plugin-* dependencies in package.json.
      - name: Checkout ave-plugin-pyxis
        uses: actions/checkout@v4
        with:
          repository: former_org/ave-plugin-pyxis
          path: ave-plugin-pyxis
      - name: Checkout ave-plugin-meeting
        uses: actions/checkout@v4
        with:
          repository: former_org/ave-plugin-meeting
          path: ave-plugin-meeting
      - name: Checkout ave-plugin-lyra-post
        uses: actions/checkout@v4
        with:
          repository: former_org/ave-plugin-lyra-post
          path: ave-plugin-lyra-post
      - name: Checkout ave-plugin-lyra-cal
        uses: actions/checkout@v4
        with:
          repository: former_org/ave-plugin-lyra-cal
          path: ave-plugin-lyra-cal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install xvfb + Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 libnss3 libasound2t64 libxss1 libxshmfence1 \
            libgbm1 libdrm2 libxcomposite1 libxrandr2 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2

      - name: Install ave deps
        working-directory: ave
        run: npm ci

      - name: Install Playwright browsers (none needed for electron, skip deps)
        working-directory: ave
        run: npx playwright install --with-deps=false || true

      - name: Build app + plugins
        working-directory: ave
        run: npm run start:npm --dry-run || true
        # Use explicit build step rather than start (which also launches electron).
      - name: Build
        working-directory: ave
        run: |
          npm run prepare:plugins:npm
          npm run build:npm

      - name: Run Playwright UI E2E under xvfb
        working-directory: ave
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ave/playwright-report
          if-no-files-found: ignore
