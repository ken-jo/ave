version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per ecosystem each week: every PR costs a full CI run.
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Owner decision 2026-11-01: Windows extensions move to MXC; hosts
      # without MXC keep srt-win at the 0.0.80 grant model. 0.0.81 replaces
      # ordinary-token grants with persistent write roots (see the design on
      # deps/sandbox-runtime-0.0.81). Remove when that fallback is retired or
      # re-designed.
      - dependency-name: "@anthropic-ai/sandbox-runtime"
        versions: [">= 0.0.81"]
      # 1.0.11-1.0.13 abort under Electron on Linux (upstream issue 1405) and
      # 1.1.0 renders PDF pages ~7x slower on the hosted Windows runner (480 ms
      # -> over the 3 s parse budget). Later releases are proposed again.
      - dependency-name: "@napi-rs/canvas"
        versions: ["1.0.11", "1.0.12", "1.0.13", "1.1.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  # The site under web/ has its own bun.lock. Dependabot's npm updater refuses
  # a directory whose only lockfile is bun.lock, so every directory holding
  # one is a "bun" entry (GitHub's Dependabot options reference: Bun >= 1.1.39).
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-bun:
        patterns: ["*"]
