version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per ecosystem each week: every PR costs a full CI run.
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Owner decision 2026-11-01: Windows extensions move to MXC; hosts
      # without MXC keep srt-win at the 0.0.80 grant model. 0.0.81 replaces
      # ordinary-token grants with persistent write roots (see the design on
      # deps/sandbox-runtime-0.0.81). Remove when that fallback is retired or
      # re-designed.
      - dependency-name: "@anthropic-ai/sandbox-runtime"
        versions: [">= 0.0.81"]
      # 1.0.11-1.0.13 abort under Electron on Linux (upstream issue 1405) and
      # 1.1.0 renders PDF pages ~7x slower on the hosted Windows runner (480 ms
      # -> over the 3 s parse budget). Later releases are proposed again.
      - dependency-name: "@napi-rs/canvas"
        versions: ["1.0.11", "1.0.12", "1.0.13", "1.1.0"]
      # pdfjs-dist 6.5.438 (the first release after 6.4.299) requires
      # @napi-rs/canvas ^1.0.13. Against our 1.0.10 pin, the installer nests
      # canvas 1.1.0 under pdfjs-dist, and that build mixes with ours in one
      # render. Remove this entry together with the canvas entry above once a
      # canvas release after 1.1.0 passes both checks.
      - dependency-name: "pdfjs-dist"
        versions: [">= 6.5.0"]
      # The stale 2021 canary line (React 16/17, no types) sorts above every
      # 7.0.0-beta by semver, so Dependabot offers it as an "upgrade". The range
      # covers only 7.0.0-canary.*; beta and stable releases are still proposed.
      - dependency-name: "react-data-grid"
        versions: [">= 7.0.0-canary, < 7.0.0-canaryz"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  # The site under web/ has its own bun.lock. Dependabot's npm updater refuses
  # a directory whose only lockfile is bun.lock, so every directory holding
  # one is a "bun" entry (GitHub's Dependabot options reference: Bun >= 1.1.39).
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-bun:
        patterns: ["*"]
